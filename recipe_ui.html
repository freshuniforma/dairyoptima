function openStabilityPhaseForm(recipe, phase) {
  const protocols = (APP.data.uhtProtocols || []).filter(p => p.testPhase === phase);
  const existingTests = (recipe.stabilityTest || []).filter(t => t.testPhase === phase);

  // Kalau protocols kosong untuk fase ini, fallback ke test existing
  let rowsSource = protocols;
  if (rowsSource.length === 0 && existingTests.length > 0) {
    rowsSource = existingTests.map(t => ({
      parameterTest: t.parameter,
      acceptanceCriteria: t.acceptanceCriteria
    }));
  }
  if (rowsSource.length === 0) {
    showToast('Tidak ada parameter di uht_protocols untuk fase ' + phase, 'warn');
    return;
  }

  // Build rows
  const rowsHtml = rowsSource.map((p, i) => {
    const existing = existingTests.find(t => t.parameter === p.parameterTest);
    const val = existing ? (existing.value || '') : '';
    const status = existing ? (existing.status || 'Pending') : 'Pending';
    const notes = existing ? (existing.notes || '') : '';
    return '<tr class="border-t" data-rowidx="' + i + '" data-acceptance="' + escapeHtml(p.acceptanceCriteria || '') + '">' +
      '<td class="px-2 py-1 text-xs">' + escapeHtml(p.parameterTest) + '</td>' +
      '<td class="px-2 py-1"><input type="text" class="st-value w-full border rounded px-1 py-0.5 text-xs" value="' + escapeHtml(val) + '" placeholder="nilai"></td>' +
      '<td class="px-2 py-1 text-xs text-gray-600">' + escapeHtml(p.acceptanceCriteria || '-') + '</td>' +
      '<td class="px-2 py-1">' +
      '  <select class="st-status w-full border rounded px-1 py-0.5 text-xs">' +
      '    <option value="Pending"' + (status === 'Pending' ? ' selected' : '') + '>Pending</option>' +
      '    <option value="Pass"' + (status === 'Pass' ? ' selected' : '') + '>Pass</option>' +
      '    <option value="Fail"' + (status === 'Fail' ? ' selected' : '') + '>Fail</option>' +
      '  </select>' +
      '  <div class="st-auto-hint text-[9px] text-gray-500 mt-0.5" data-hint="' + i + '"></div>' +
      '</td>' +
      '<td class="px-2 py-1"><input type="text" class="st-notes w-full border rounded px-1 py-0.5 text-xs" value="' + escapeHtml(notes) + '" placeholder="catatan"></td>' +
      '</tr>';
  }).join('');

  const existingDate = (existingTests[0] && existingTests[0].testDate)
    ? existingTests[0].testDate.substring(0, 10)
    : new Date().toISOString().substring(0, 10);

  const body =
    '<div class="modal-form-container">' +
    '  <div class="mb-3 p-2 bg-blue-50 rounded text-xs">' +
    '    <div><b>Resep:</b> ' + escapeHtml(recipe.recipeId + ' — ' + recipe.recipeName) + '</div>' +
    '    <div><b>Fase:</b> <span class="badge badge-B">' + escapeHtml(phase) + '</span> (' + rowsSource.length + ' parameter)</div>' +
    '  </div>' +
    '  <div class="mb-2">' +
    '    <label class="form-label">Tanggal Uji</label>' +
    '    <input id="st_date" type="date" class="form-input" value="' + escapeHtml(existingDate) + '">' +
    '  </div>' +
    '  <div class="border rounded overflow-hidden">' +
    '    <table class="w-full"><thead><tr class="bg-gray-100 text-xs">' +
    '      <th class="text-left px-2 py-1">Parameter</th>' +
    '      <th class="text-left px-2 py-1 w-24">Nilai</th>' +
    '      <th class="text-left px-2 py-1">Acceptance</th>' +
    '      <th class="text-center px-2 py-1 w-24">Status</th>' +
    '      <th class="text-left px-2 py-1 w-32">Catatan</th>' +
    '    </tr></thead><tbody id="st_body">' + rowsHtml + '</tbody></table>' +
    '  </div>' +
    '  <div class="text-[10px] text-gray-500 mt-1">Nilai bisa berupa angka/teks (mis. "6.68", "&lt; 1 mm", "OK"). Status diisi manual atau sesuaikan setelah cek.</div>' +
    '  <div class="mt-4 flex gap-2 justify-end">' +
    '    <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Batal</button>' +
    '    <button id="btnSaveStabilityPhase" class="px-4 py-1.5 bg-green-600 hover:bg-green-500 text-white rounded text-sm font-medium">💾 Simpan Fase ' + escapeHtml(phase) + '</button>' +
    '  </div>' +
    '</div>';

  openModal('🧫 Input Stability — ' + phase, body);
    // Auto-preview status saat user ketik nilai
  document.querySelectorAll('#st_body tr').forEach(tr => {
    const valInput = tr.querySelector('.st-value');
    const statusSel = tr.querySelector('.st-status');
    const hintEl = tr.querySelector('.st-auto-hint');
    const acceptance = tr.dataset.acceptance || '';

    function refreshAutoHint() {
      const v = valInput.value.trim();
      if (!v) { hintEl.textContent = ''; return; }
      const auto = evaluateAcceptance_(v, acceptance);
      if (auto === 'Pass') hintEl.innerHTML = '<span class="text-green-600 font-semibold">✓ auto: Pass</span>';
      else if (auto === 'Fail') hintEl.innerHTML = '<span class="text-red-600 font-semibold">✗ auto: Fail</span>';
      else hintEl.innerHTML = '<span class="text-gray-400">?</span>';
    }
    valInput.addEventListener('input', refreshAutoHint);
    refreshAutoHint();
  });

  document.getElementById('btnSaveStabilityPhase').addEventListener('click', async () => {
    const dateVal = document.getElementById('st_date').value || new Date().toISOString();
    const rows = document.querySelectorAll('#st_body tr');
    const tests = [];
    rows.forEach(tr => {
      const idx = parseInt(tr.dataset.rowidx, 10);
      const param = rowsSource[idx].parameterTest;
      const acceptance = rowsSource[idx].acceptanceCriteria;
      const value = tr.querySelector('.st-value').value.trim();
      const manualStatus = tr.querySelector('.st-status').value;
      const notes = tr.querySelector('.st-notes').value.trim();

      // Auto-evaluate jika user set status = Pending tapi ada nilai
      let autoStatus = 'Pending';
      if (value && manualStatus === 'Pending') {
        autoStatus = evaluateAcceptance_(value, acceptance || '');
      }

      // Hanya simpan yang ada nilai atau status bukan Pending
      const finalStatus = (manualStatus !== 'Pending') ? manualStatus : autoStatus;
      if (value || finalStatus !== 'Pending') {
        tests.push({
          parameter: param,
          value: value,
          acceptanceCriteria: acceptance || '',
          status: finalStatus,
          notes: notes
        });
      }
    });
    if (tests.length === 0) {
      showToast('Isi minimal 1 parameter', 'warn');
      return;
    }
    const btn = document.getElementById('btnSaveStabilityPhase');
    btn.disabled = true;
    btn.textContent = '⏳ Menyimpan…';
    try {
      const res = await callApi('api_saveStabilityPhase', [recipe.recipeId, {
        testPhase: phase,
        testDate: dateVal,
        tests: tests
      }], 20000);
      if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal simpan');
      // Reload recipe detail
      const detailRes = await callApi('api_getRecipeDetail', [recipe.recipeId], 25000);
      if (detailRes && detailRes.ok) {
        RECIPE_APP.detail = detailRes.recipe;
        RECIPE_APP.detailFourEngine = detailRes.fourEngineFull;
        RECIPE_APP.isOwner = !!detailRes.isOwner;
      }
      closeModal();
      showToast('✅ Fase ' + phase + ' tersimpan', 'success');
      renderRecipeDetailTabContent();
    } catch (e) {
      showToast('Gagal: ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = '💾 Simpan Fase ' + phase;
    }
  });
}
// ============================================================
// TAB: QUALITY METRICS (Prediksi vs Aktual)
// ============================================================
function renderRecipeDetailQualityTab(recipe) {
  const stored = recipe.actualQualityMetrics || {};
  const predicted = stored.predicted || {};
  const actual = stored.actual || {};
  const delta = stored.delta || {};

  // Fallback: hitung prediksi dari recipe.qualityMetrics (jika ada dari formula asli)
  if (!predicted.pH && recipe.qualityMetrics) {
    const qm = recipe.qualityMetrics;
    predicted.pH = qm.pH;
    predicted.pHStatus = qm.pHStatus;
    predicted.brix = qm.brix;
    predicted.totalSolid = qm.totalSolid;
    predicted.viscosityCP = qm.viscosityEstimateCP;
    predicted.viscosityCategory = qm.viscosityCategory;
    predicted.stabilizerPct = qm.stabilizerPct;
  }

  const isOwner = RECIPE_APP.isOwner;

  function deltaBadge(key, val, goodThreshold, warnThreshold) {
    if (val === null || val === undefined) return '<span class="text-gray-400">—</span>';
    const abs = Math.abs(val);
    let cls = 'badge-ok', label = '✓ OK';
    if (abs > warnThreshold) { cls = 'badge-High'; label = '⚠ Cek'; }
    else if (abs > goodThreshold) { cls = 'badge-Medium'; label = 'Δ'; }
    const sign = val > 0 ? '+' : '';
    return '<span class="badge ' + cls + '">' + label + ' (' + sign + fmtNum(val, 3) + ')</span>';
  }

  function renderRow(key, label, unit, predictedVal, actualVal, deltaVal, thresholds) {
    const predStr = (predictedVal !== undefined && predictedVal !== null) ? fmtNum(predictedVal, 2) : '-';
    const actStr = (actualVal !== undefined && actualVal !== null) ? fmtNum(actualVal, 2) : '<span class="text-gray-400">belum diisi</span>';
    const inputId = 'qm_input_' + key;
    const isEditable = isOwner;
    return '<tr class="border-b">' +
      '<td class="py-1 px-1 text-xs font-semibold">' + escapeHtml(label) + '</td>' +
      '<td class="py-1 px-1 text-xs text-center text-gray-700">' + predStr + ' <span class="text-[10px] text-gray-500">' + escapeHtml(unit) + '</span></td>' +
      '<td class="py-1 px-1 text-xs text-center">' +
        (isEditable
          ? '<input id="' + inputId + '" type="number" step="0.001" class="border rounded px-1 py-0.5 text-xs w-24" value="' + (actualVal !== undefined && actualVal !== null ? actualVal : '') + '" placeholder="aktual">'
          : actStr) +
      '</td>' +
      '<td class="py-1 px-1 text-xs text-center">' + deltaBadge(key, deltaVal, thresholds.good, thresholds.warn) + '</td>' +
      '</tr>';
  }

  const rowsHtml =
    renderRow('pH', 'pH', 'pH units', predicted.pH, actual.pH, delta.pH, { good: 0.05, warn: 0.10 }) +
    renderRow('brix', 'Brix', '°Brix', predicted.brix, actual.brix, delta.brix, { good: 0.5, warn: 1.0 }) +
    renderRow('totalSolid', 'Total Solid', 'g/100g', predicted.totalSolid, actual.totalSolid, delta.totalSolid, { good: 0.3, warn: 0.8 }) +
    renderRow('viscosityCP', 'Viskositas', 'cP', predicted.viscosityCP, actual.viscosityCP, delta.viscosityCP, { good: 2, warn: 5 });

  let statusHtml = '';
  const predictedPH = predicted.pH;
  if (predictedPH !== undefined && predictedPH !== null) {
    const phStatusCls = predicted.pHStatus === 'Optimal' ? 'badge-ok' : 'badge-Medium';
    const viscCat = predicted.viscosityCategory || '-';
    statusHtml =
      '<div class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-3 text-xs">' +
      '  <div class="p-2 bg-blue-50 rounded border border-blue-200"><b>Prediksi pH:</b> ' + fmtNum(predictedPH, 2) + ' <span class="badge ' + phStatusCls + ' ml-1">' + escapeHtml(predicted.pHStatus || '-') + '</span></div>' +
      '  <div class="p-2 bg-blue-50 rounded border border-blue-200"><b>Prediksi Viskositas:</b> ' + fmtNum(predicted.viscosityCP, 2) + ' cP <span class="badge badge-Medium ml-1">' + escapeHtml(viscCat) + '</span></div>' +
      '  <div class="p-2 bg-blue-50 rounded border border-blue-200"><b>Stabilizer %:</b> ' + fmtNum(predicted.stabilizerPct, 3) + '%</div>' +
      '</div>';
  }

  const notesVal = actual.notes || '';
  const notesHtml =
    '<div class="mt-3">' +
    '  <label class="form-label text-xs">Catatan Pengukuran (opsional)</label>' +
    (isOwner
      ? '<textarea id="qm_notes" class="form-input" rows="2" placeholder="Alat ukur, kondisi sampel, catatan trial…">' + escapeHtml(notesVal) + '</textarea>'
      : '<div class="p-2 bg-gray-50 rounded text-xs whitespace-pre-wrap">' + (notesVal ? escapeHtml(notesVal) : '<span class="text-gray-400">(tidak ada catatan)</span>') + '</div>') +
    '</div>';

  const saveHtml = isOwner
    ? '<div class="mt-3 flex justify-end">' +
      '  <button id="btnSaveQuality" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded text-sm font-medium">💾 Simpan Aktual</button>' +
      '</div>'
    : '<div class="mt-3 p-2 bg-orange-50 border border-orange-200 rounded text-xs text-orange-700">Read-only (bukan pemilik). Hanya pemilik yang bisa mengisi aktual.</div>';

  let updatedInfo = '';
  if (actual.updatedAt) {
    updatedInfo = '<div class="text-[11px] text-gray-500 mb-2">Terakhir diupdate: ' + escapeHtml(actual.updatedAt.replace('T', ' ').substring(0, 19)) + ' oleh ' + escapeHtml(actual.updatedBy || '-') + '</div>';
  }

  return (
    '<h3 class="font-semibold mb-2">📊 Quality Metrics — Prediksi vs Aktual</h3>' +
    '<p class="text-xs text-gray-500 mb-3">Prediksi dari model (estimateQualityMetrics), aktual diisi dari hasil lab / trial produksi.</p>' +
    updatedInfo +
    statusHtml +
    '<div class="overflow-x-auto mb-3">' +
    '<table class="w-full"><thead><tr class="bg-gray-100">' +
    '<th class="text-left py-1 px-1 text-xs">Parameter</th>' +
    '<th class="text-center py-1 px-1 text-xs">Prediksi</th>' +
    '<th class="text-center py-1 px-1 text-xs">Aktual</th>' +
    '<th class="text-center py-1 px-1 text-xs">Delta</th>' +
    '</tr></thead><tbody>' + rowsHtml + '</tbody></table>' +
    '</div>' +
    notesHtml +
    saveHtml
  );
}

function bindQualityTabEvents(recipe) {
  const btnSave = document.getElementById('btnSaveQuality');
  if (!btnSave) return;
  btnSave.addEventListener('click', async function () {
    const actual = {
      pH: document.getElementById('qm_input_pH') ? document.getElementById('qm_input_pH').value : '',
      brix: document.getElementById('qm_input_brix') ? document.getElementById('qm_input_brix').value : '',
      totalSolid: document.getElementById('qm_input_totalSolid') ? document.getElementById('qm_input_totalSolid').value : '',
      viscosityCP: document.getElementById('qm_input_viscosityCP') ? document.getElementById('qm_input_viscosityCP').value : '',
      notes: document.getElementById('qm_notes') ? document.getElementById('qm_notes').value : ''
    };
    ['pH', 'brix', 'totalSolid', 'viscosityCP'].forEach(function (k) {
      if (actual[k] === '') actual[k] = null;
    });
    const hasAny = ['pH', 'brix', 'totalSolid', 'viscosityCP'].some(function (k) { return actual[k] !== null && actual[k] !== ''; });
    if (!hasAny) {
      showToast('Isi minimal satu nilai aktual', 'warn');
      return;
    }
    btnSave.disabled = true;
    btnSave.textContent = '⏳ Menyimpan…';
    try {
      const res = await callApi('api_saveActualQualityMetrics', [recipe.recipeId, actual], 20000);
      if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal simpan');
      RECIPE_APP.detail.actualQualityMetrics = res.stored;
      showToast('✅ Quality metrics tersimpan', 'success');
      renderRecipeDetailTabContent();
    } catch (e) {
      showToast('Gagal: ' + e.message, 'error');
      btnSave.disabled = false;
      btnSave.textContent = '💾 Simpan Aktual';
    }
  });
}

    '    <label class="form-label">Catatan (opsional)</label>' +

    '    <b>ℹ️ Setelah Adopt:</b> resep akan tersimpan dengan Status = <b>Draft</b>, dan Anda bisa melengkapi Process Procedure, Actual Quality Metrics, Stability Test Log, dan Versioning di Recipe Bank.' +
    '  </div>' +

    '    <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Batal</button>' +

    '  </div>' +
    '</div>';

  openModal('📥 Adopt sebagai Resep Baru', body);

  document.getElementById('btnConfirmAdopt').addEventListener('click', async () => {
    const nameInput = document.getElementById('adoptRecipeName');
    const notesInput = document.getElementById('adoptRecipeNotes');

    if (!name) {
      showToast('Nama resep wajib diisi', 'warn');
      nameInput.focus();
      return;
    }
    if (name.length > 100) {
      showToast('Nama resep maksimal 100 karakter', 'warn');
      return;
    }

    const btn = document.getElementById('btnConfirmAdopt');
    btn.disabled = true;
    btn.textContent = '⏳ Menyimpan resep …';

    try {
      const payload = {
        recipeName: name,
        notes: (notesInput.value || '').trim(),
        productId: APP.lastOptimizerResult ? APP.lastOptimizerResult.productId : null,
        waterParams: (APP.lastOptimizerResult && APP.lastOptimizerResult.waterParams) || APP.waterParams,

        switchTab('recipeBank');

          if (typeof loadRecipeBankList === 'function') loadRecipeBankList();

      }, 400);

    } catch (e) {
      showToast('Gagal: ' + e.message, 'error');
      btn.disabled = false;
      btn.textContent = '✅ Adopt Resep';
    }
  });
}

async function renderHistoryTab(container, recipe) {
  container.innerHTML = '<div class="flex items-center gap-3 p-6"><div class="spinner"></div><span>Memuat history…</span></div>';

  try {
    const res = await callApi('api_listRecipeVersions', [recipe.recipeId], 15000);
    if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal memuat history');

    const versions = res.versions || [];
    const currentVersion = res.currentVersion || (recipe.version || 1);

    if (versions.length === 0) {
      container.innerHTML =
        '<div class="card p-4 text-center">' +
        '  <div class="text-3xl mb-2">📜</div>' +
        '  <h3 class="font-bold mb-1">Belum ada history</h3>' +
        '  <p class="text-sm text-gray-600 mb-3">Anda baru memiliki <b>v' + currentVersion + '</b> (saat ini). ' +
        'Klik <b>📌 Save as New Version</b> di header untuk membuat versi baru dan menyimpan history.</p>' +
        '</div>';
      return;
    }

    // Build rows
    const rows = versions.map(v => {
      const isRollbackCandidate = RECIPE_APP.isOwner && v.version < currentVersion;
      return '<tr class="border-b">' +
        '<td class="px-2 py-2 text-xs font-mono"><b>v' + v.version + '</b></td>' +
        '<td class="px-2 py-2 text-xs">' + escapeHtml((v.changedAt || '').replace('T', ' ').substring(0, 19)) + '</td>' +
        '<td class="px-2 py-2 text-xs">' + escapeHtml(v.changedBy || '-') + '</td>' +
        '<td class="px-2 py-2 text-xs">' + escapeHtml(v.changeNotes || '-') + '</td>' +
        '<td class="px-2 py-2 text-center">' +
        (isRollbackCandidate
          ? '<button class="btn-rollback bg-amber-600 hover:bg-amber-500 text-white px-2 py-1 rounded text-xs font-medium" data-version="' + v.version + '">🔄 Restore</button>'
          : '<span class="text-[10px] text-gray-400">' + (v.version === currentVersion ? 'Saat ini' : '-') + '</span>') +
        '</td></tr>';
    }).join('');

    container.innerHTML =
      '<h3 class="font-semibold mb-2">📜 Version History</h3>' +
      '<p class="text-xs text-gray-500 mb-3">Daftar versi lama. Versi saat ini: <b>v' + currentVersion + '</b>. ' +
      'Klik <b>Restore</b> untuk mengembalikan resep ke versi tertentu (akan membuat versi baru dengan data dari versi tersebut).</p>' +
      '<div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-gray-100 text-xs">' +
      '<th class="text-left px-2 py-1">Versi</th>' +
      '<th class="text-left px-2 py-1">Tanggal</th>' +
      '<th class="text-left px-2 py-1">Oleh</th>' +
      '<th class="text-left px-2 py-1">Catatan Perubahan</th>' +
      '<th class="text-center px-2 py-1">Aksi</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="mt-2 p-2 bg-blue-50 border border-blue-200 rounded text-[11px] text-blue-800">' +
      '  ℹ️ Setiap klik "Save as New Version" akan membuat entri di sini. Rollback akan menyimpan state saat ini dulu (auto-snapshot) sebelum mengembalikan ke versi target.' +
      '</div>';

    // Bind rollback
    container.querySelectorAll('.btn-rollback').forEach(btn => {
      btn.addEventListener('click', () => showRollbackDialog(recipe, parseInt(btn.dataset.version, 10)));
    });
  } catch (e) {
    container.innerHTML = '<div class="card p-4 border-red-300"><h3 class="font-bold text-red-700 mb-1">Gagal</h3><p class="text-sm">' + escapeHtml(e.message) + '</p><button onclick="renderRecipeDetailTabContent()" class="mt-2 bg-blue-600 text-white px-3 py-1 rounded text-sm">Coba lagi</button></div>';
  }
}

function showRollbackDialog(recipe, targetVersion) {
  const currentV = recipe.version || 1;
  const body =
    '<div class="modal-form-container">' +
    '  <div class="p-3 bg-amber-50 border border-amber-200 rounded mb-3 text-sm">' +
    '    <div class="text-amber-900 font-semibold mb-1">⚠️ Rollback ke v' + targetVersion + '</div>' +
    '    <div class="text-xs text-amber-800">' +
    '      Data saat ini (v' + currentV + ') akan di-snapshot dulu, lalu resep dikembalikan ke data dari v' + targetVersion + '. ' +
    '      Versi baru akan menjadi <b>v' + (currentV + 1) + '</b>.' +
    '    </div>' +
    '  </div>' +
    '  <div class="text-xs text-gray-600 mb-3">' +
    '    Semua perubahan setelah v' + targetVersion + ' (komposisi, status, catatan, process, quality, stability) akan <b>DIGANTI</b> dengan data dari v' + targetVersion + '. ' +
    '    Versi yang sekarang tidak hilang — tersimpan sebagai history.' +
    '  </div>' +
    '  <div class="mt-4 flex gap-2 justify-end">' +
    '    <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Batal</button>' +
    '    <button id="btnDoRollback" class="px-4 py-1.5 bg-amber-600 hover:bg-amber-500 text-white rounded text-sm font-medium">🔄 Rollback ke v' + targetVersion + '</button>' +
    '  </div>' +
    '</div>';
  openModal('🔄 Rollback', body);

  document.getElementById('btnDoRollback').addEventListener('click', async () => {
    const btn = document.getElementById('btnDoRollback');
    btn.disabled = true; btn.textContent = '⏳ Rollback…';
    try {
      const res = await callApi('api_rollbackRecipeVersion', [recipe.recipeId, targetVersion], 20000);

      closeModal();

    } catch (e) {
      showToast('Gagal: ' + e.message, 'error');
      btn.disabled = false; btn.textContent = '🔄 Rollback';
    }
  });
}

async function executePrintRecipe(recipe, selectedSections) {

  const fullDetail = RECIPE_APP.detail || recipe;

  // Render HTML sections
  const sectionsHtml = selectedSections.map(id => {
    let content = '';
    let title = '';
    try {
      if (id === 'recipe') { title = 'Resep & Komposisi'; content = renderRecipeDetailRecipeTab(fullDetail); }
      else if (id === 'process') { 
        title = 'Process Procedure'; 
        // Paksa render mode read-only dengan memalsukan isOwner=false sementara
        const originalIsOwner = RECIPE_APP.isOwner;
        RECIPE_APP.isOwner = false; 
        content = renderRecipeDetailProcessTab(fullDetail);

function renderManualContent(searchQuery = '') {
  const container = document.getElementById('manualContent');
  if (!container) return;

  const q = searchQuery.toLowerCase().trim();
  
  // Filter data manual berdasarkan judul atau keyword
  const filtered = MANUAL_DATA.filter(item => {
    if (q === '') return true;
    return item.title.toLowerCase().includes(q) || item.keywords.toLowerCase().includes(q) || item.html.toLowerCase().includes(q);
  });

  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="p-8 text-center text-gray-500">
        <div class="text-4xl mb-2">🔍</div>
        <h3 class="font-bold text-lg text-gray-700">Tidak ada panduan ditemukan</h3>
        <p class="text-sm">Coba kata kunci lain (misal: "version", "proses", "bpom").</p>
      </div>
    `;
    return;
  }

  container.innerHTML = filtered.map(item => `
    <div class="card p-0 overflow-hidden mb-3">
      <details class="group" ${q !== '' ? 'open' : ''}>
        <summary class="bg-gray-50 px-4 py-3 font-semibold text-blue-800 cursor-pointer hover:bg-gray-100 flex justify-between items-center list-none">
          ${escapeHtml(item.title)}
          <span class="text-gray-400 group-open:rotate-180 transition-transform">▼</span>
        </summary>
        <div class="p-4 text-sm text-gray-700 border-t">
          ${item.html}
        </div>
      </details>
    </div>
  `).join('');
}
