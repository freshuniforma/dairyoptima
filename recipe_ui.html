<script>
// ============================================================
// RECIPE BANK — UI (v1.0.0)
// Bagian 1/2 — State, List View, Detail Modal, Tab 1-3
// ============================================================

if (!window.RECIPE_APP) {
  window.RECIPE_APP = {
    list: [],
    allRecipes: [], // <--- TAMBAHKAN INI (Penampung data dari server)
    filters: { status: 'All', productId: '', bpomCategory: '', search: '' },
    selectedRecipeId: null,
    detail: null,
    detailFourEngine: null,
    activeTab: 'recipe',
    loading: false,
    isOwner: false
  };
}

// ============================================================
// TAB: RECIPE BANK (LIST VIEW)
// ============================================================
function renderRecipeBankTab(c) {
  if (!APP.data) {
    c.innerHTML = '<div class="flex items-center gap-3 p-6"><div class="spinner"></div><span>Memuat data…</span></div>';
    return;
  }

  const statusOpts = ['All', 'Draft', 'Trial', 'Approved', 'Archived']
    .map(s => `<option value="${s}"${RECIPE_APP.filters.status === s ? ' selected' : ''}>${s}</option>`)
    .join('');

  const productOpts = ['<option value="">Semua Produk</option>'].concat(
    (APP.data.products || []).map(p =>
      `<option value="${escapeHtml(p.productId)}"${RECIPE_APP.filters.productId === p.productId ? ' selected' : ''}>${escapeHtml(p.productId + ' — ' + p.product)}</option>`
    )
  ).join('');

  const bpomOpts = '<option value="">Semua Kategori</option>' +
    '<option value="Plain"' + (RECIPE_APP.filters.bpomCategory === 'Plain' ? ' selected' : '') + '>Plain</option>' +
    '<option value="Flavoured"' + (RECIPE_APP.filters.bpomCategory === 'Flavoured' ? ' selected' : '') + '>Flavoured</option>';

  c.innerHTML =
    '<div class="card p-4 mb-3">' +
    '  <div class="flex flex-wrap justify-between items-center gap-2 mb-3">' +
    '    <h2 class="text-xl font-bold">🍶 Recipe Bank</h2>' +
    '    <div class="flex gap-2">' +
    '      <button id="btnNewRecipe" class="bg-green-600 hover:bg-green-500 text-white px-3 py-1.5 rounded text-sm font-medium">+ Resep Baru</button>' +
    '      <button id="btnRecipeRefresh" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded text-sm font-medium">🔄 Refresh</button>' +
    '    </div>' +
    '  </div>' +
    '  <div class="grid grid-cols-1 md:grid-cols-4 gap-2">' +
    '    <div><label class="block text-xs font-semibold mb-1">Cari</label><input id="recipeSearchInput" type="text" class="w-full border rounded px-2 py-1 text-sm" placeholder="Nama, ID, catatan…" value="' + escapeHtml(RECIPE_APP.filters.search) + '"></div>' +
    '    <div><label class="block text-xs font-semibold mb-1">Status</label><select id="recipeStatusFilter" class="w-full border rounded px-2 py-1 text-sm">' + statusOpts + '</select></div>' +
    '    <div><label class="block text-xs font-semibold mb-1">Produk</label><select id="recipeProductFilter" class="w-full border rounded px-2 py-1 text-sm">' + productOpts + '</select></div>' +
    '    <div><label class="block text-xs font-semibold mb-1">BPOM Kategori</label><select id="recipeBpomFilter" class="w-full border rounded px-2 py-1 text-sm">' + bpomOpts + '</select></div>' +
    '  </div>' +
    '</div>' +
    '<div id="recipeBankListContainer"><div class="flex items-center gap-3 p-6"><div class="spinner"></div><span>Memuat resep…</span></div></div>';

  document.getElementById('btnRecipeRefresh').addEventListener('click', function() {
    loadRecipeBankList(true);
  });
  document.getElementById('btnNewRecipe').addEventListener('click', showManualRecipeForm);
  // Event listener Search
  document.getElementById('recipeSearchInput').addEventListener('input', debounceRecipeSearch(function (val) {
    // val sekarang berisi teks yang diketik
    RECIPE_APP.filters.search = String(val || '');
    filterAndRenderRecipes();
  }, 300));

  // Event listener Status
  document.getElementById('recipeStatusFilter').addEventListener('change', function (e) {
    RECIPE_APP.filters.status = String(e.target.value || 'All');
    filterAndRenderRecipes();
  });

  // Event listener Produk
  document.getElementById('recipeProductFilter').addEventListener('change', function (e) {
    RECIPE_APP.filters.productId = String(e.target.value || '');
    filterAndRenderRecipes();
  });

  // Event listener BPOM
  document.getElementById('recipeBpomFilter').addEventListener('change', function (e) {
    RECIPE_APP.filters.bpomCategory = String(e.target.value || '');
    filterAndRenderRecipes();
  });

  loadRecipeBankList();
}

function debounceRecipeSearch(fn, delay) {
  let timer = null;
  return function (e) { // Tangkap event 'e'
    const val = e.target.value; // Ambil value langsung dari input
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () { fn(val); }, delay);
  };
}

async function loadRecipeBankList(forceRefresh) {
  const container = document.getElementById('recipeBankListContainer');
  if (!container) return;
  
  // Jika data sudah ada di memori dan tidak dipaksa refresh, langsung render
  if (!forceRefresh && RECIPE_APP.allRecipes && RECIPE_APP.allRecipes.length > 0) {
    filterAndRenderRecipes();
    return;
  }

  RECIPE_APP.loading = true;
  container.innerHTML = '<div class="flex items-center gap-3 p-6"><div class="spinner"></div><span>Memuat resep…</span></div>';

  try {
    // KUNCI PERBAIKAN: Kirim parameter berupa string murni, jangan gunakan objek kosong {}
    const safeParams = { status: 'All', search: '', productId: '', bpomCategory: '' };
    const res = await callApi('api_listRecipes', [safeParams], 20000);
    
    if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal memuat resep');

    // Simpan semua data ke memori Frontend
    RECIPE_APP.allRecipes = res.recipes || [];
    filterAndRenderRecipes();
  } catch (e) {
    container.innerHTML = '<div class="card p-4 border-red-300"><h3 class="font-bold text-red-700 mb-1">Gagal memuat</h3><p class="text-sm">' + escapeHtml(e.message) + '</p><button onclick="loadRecipeBankList(true)" class="mt-2 bg-blue-600 text-white px-3 py-1 rounded text-sm">Coba lagi</button></div>';
  } finally {
    RECIPE_APP.loading = false;
  }
}

function filterAndRenderRecipes() {
  const all = RECIPE_APP.allRecipes || [];
  const f = RECIPE_APP.filters || {};
  
  // Pastikan semua filter dibaca sebagai String untuk mencegah error
  const q = String(f.search || '').toLowerCase().trim();
  const status = String(f.status || 'All');
  const productId = String(f.productId || '');
  const bpom = String(f.bpomCategory || '');

  // 1. Filter data
  let filtered = all.filter(r => {
    if (status !== 'All' && r.status !== status) return false;
    if (productId !== '' && r.productId !== productId) return false;
    if (bpom !== '' && r.bpomCategory !== bpom) return false;
    
    // Pencarian Teks
    if (q !== '') {
      const name = String(r.recipeName || '').toLowerCase();
      const id = String(r.recipeId || '').toLowerCase();
      const notes = String(r.notes || '').toLowerCase();
      if (!name.includes(q) && !id.includes(q) && !notes.includes(q)) return false;
    }
    return true;
  });

  // 2. Urutkan berdasarkan yang terbaru (UpdatedAt)
  filtered.sort((a, b) => String(b.updatedAt || '').localeCompare(String(a.updatedAt || '')));

  // 3. Jika kotak search KOSONG, potong jadi Top 10 saja
  const totalFound = filtered.length;
  if (q === '' && filtered.length > 10) {
    filtered = filtered.slice(0, 10);
  }

  // Simpan hasil untuk dipakai fungsi render
  RECIPE_APP.list = filtered;
  renderRecipeBankList(totalFound, q !== '');
}

function renderRecipeBankList(totalFound, isSearching) {
  const container = document.getElementById('recipeBankListContainer');
  if (!container) return;

  if (!RECIPE_APP.list || RECIPE_APP.list.length === 0) {
    container.innerHTML =
      '<div class="card p-6 text-center">' +
      '  <div class="text-3xl mb-2">📭</div>' +
      '  <h3 class="font-bold mb-1">Tidak ada resep ditemukan</h3>' +
      '  <p class="text-sm text-gray-600 mb-3">' +
      (isSearching ? 'Coba kata kunci lain.' : 'Resep dibuat dengan klik <b>Adopt</b> dari Detail Formula Optimizer atau tombol <b>+ Resep Baru</b>.') +
      '  </p>' +
      (isSearching ? '' : '<button onclick="switchTab(\'optimizer\')" class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded text-sm font-medium">▶️ Ke Formula Optimizer</button>') +
      '</div>';
    return;
  }

  const rows = RECIPE_APP.list.map(r => {
    const statusCls = r.status === 'Approved' ? 'badge-ok' :
                      r.status === 'Archived' ? 'badge-infeasible' :
                      'badge-Medium';
    const nlBadge = r.nutriLevelOverall && r.nutriLevelOverall !== '-' ? gradeBadge(r.nutriLevelOverall) : '<span class="badge badge-infeasible">-</span>';
    const psBadge = r.pilihanSehatPass ? '<span class="badge badge-ok">✓</span>' : '<span class="badge badge-fail">✗</span>';
    return '<tr class="border-b hover:bg-gray-50">' +
      '<td class="px-2 py-2 text-xs font-mono"><b>' + escapeHtml(r.recipeId) + '</b></td>' +
      '<td class="px-2 py-2 text-xs"><b>' + escapeHtml(r.recipeName) + '</b></td>' +
      '<td class="px-2 py-2 text-xs">' + escapeHtml(r.productId || '-') + '</td>' +
      '<td class="px-2 py-2 text-xs text-center">' + escapeHtml(r.bpomCategory || '-') + '</td>' +
      '<td class="px-2 py-2 text-center"><span class="badge ' + statusCls + '">' + escapeHtml(r.status) + '</span></td>' +
      '<td class="px-2 py-2 text-xs text-center">' +
      (r.source === 'Manual'
        ? '<span class="badge badge-Medium" title="Dibuat manual">✍️</span>'
        : '<span class="badge badge-B" title="Hasil optimasi">⚡</span>') +
      '</td>' +
      '<td class="px-2 py-2 text-xs text-center">v' + (r.version || 1) + '</td>' +
      '<td class="px-2 py-2 text-xs text-right">' + fmtRp(r.hppPerKg) + '</td>' +
      '<td class="px-2 py-2 text-center">' + nlBadge + '</td>' +
      '<td class="px-2 py-2 text-center">' + psBadge + '</td>' +
      '<td class="px-2 py-2 text-xs text-gray-500 whitespace-nowrap">' + escapeHtml((r.updatedAt || '').split('T')[0] || '-') + '</td>' +
      '<td class="px-2 py-2 text-center whitespace-nowrap">' +
      '  <button class="btn-recipe-open text-blue-600 hover:underline text-xs font-semibold mr-2" data-recipeid="' + escapeHtml(r.recipeId) + '">📋 Buka</button>' +
      '  <button class="btn-recipe-delete text-red-600 hover:underline text-xs" data-recipeid="' + escapeHtml(r.recipeId) + '" data-recname="' + escapeHtml(r.recipeName) + '">🗑️</button>' +
      '</td></tr>';
  }).join('');

  container.innerHTML =
    '<div class="card p-3">' +
    '  <div class="flex justify-between items-center mb-2">' +
    '    <h3 class="font-bold text-sm">' + (isSearching ? 'Hasil Pencarian (' + totalFound + ')' : 'Top 10 Resep Terbaru') + '</h3>' +
    '    <span class="text-xs text-gray-500">Klik "Buka" untuk detail</span>' +
    '  </div>' +
    '  <div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-gray-100 text-xs">' +
    '    <th class="text-left px-2 py-1">ID</th>' +
    '    <th class="text-left px-2 py-1">Nama Resep</th>' +
    '    <th class="text-left px-2 py-1">Produk</th>' +
    '    <th class="text-center px-2 py-1">BPOM</th>' +
    '    <th class="text-center px-2 py-1">Status</th>' +
    '    <th class="text-center px-2 py-1" title="Source">Src</th>' +
    '    <th class="text-center px-2 py-1">Versi</th>' +
    '    <th class="text-right px-2 py-1">HPP/kg</th>' +
    '    <th class="text-center px-2 py-1">Nutri</th>' +
    '    <th class="text-center px-2 py-1">PS</th>' +
    '    <th class="text-left px-2 py-1">Updated</th>' +
    '    <th class="text-center px-2 py-1">Aksi</th>' +
    '  </tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '</div>';

  container.querySelectorAll('.btn-recipe-open').forEach(btn => {
    btn.addEventListener('click', function () { showRecipeBankDetailModal(btn.dataset.recipeid); });
  });
  container.querySelectorAll('.btn-recipe-delete').forEach(btn => {
    btn.addEventListener('click', function () {
      deleteRecipeBankItem(btn.dataset.recipeid, btn.dataset.recname);
    });
  });
}

async function deleteRecipeBankItem(recipeId, recipeName) {
  if (!confirm('Arsipkan resep "' + recipeName + '" (' + recipeId + ')?\n\nResep tidak akan dihapus permanen, hanya Status = Archived.')) return;
  try {
    const res = await callApi('api_deleteRecipe', [recipeId], 15000);
    if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal mengarsipkan');
    showToast('Resep ' + recipeId + ' diarsipkan', 'success');
    await loadRecipeBankList();
  } catch (e) {
    showToast('Gagal: ' + e.message, 'error');
  }
}

// ============================================================
// DETAIL MODAL — 3 TAB
// ============================================================
async function showRecipeBankDetailModal(recipeId) {
  RECIPE_APP.selectedRecipeId = recipeId;
  RECIPE_APP.activeTab = 'recipe';
  RECIPE_APP.detail = null;
  RECIPE_APP.detailFourEngine = null;
  RECIPE_APP.isOwner = false;

  openModal('📋 Detail Resep — ' + recipeId,
    '<div class="flex items-center gap-3 p-6"><div class="spinner"></div><span>Memuat detail resep…</span></div>');

  try {
    const res = await callApi('api_getRecipeDetail', [recipeId], 25000);
    if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal memuat detail');

    RECIPE_APP.detail = res.recipe;
    RECIPE_APP.detailFourEngine = res.fourEngineFull;
    RECIPE_APP.isOwner = !!res.isOwner;
    renderRecipeBankDetailModal();
  } catch (e) {
    openModal('📋 Detail Resep — ' + recipeId,
      '<div class="card p-4 border-red-300"><h3 class="font-bold text-red-700 mb-1">Gagal memuat</h3><p class="text-sm">' + escapeHtml(e.message) + '</p></div>');
  }
}

function renderRecipeBankDetailModal() {
  const recipe = RECIPE_APP.detail;
  if (!recipe) return;

  const tabs = [
    { id: 'recipe', label: '🍶 Recipe & Cost' },
    { id: 'process', label: '⚙️ Process' },
    { id: 'nutrition', label: '🧬 Nutrisi' },
    { id: 'labeling', label: '🏷️ Labeling' },
    { id: 'quality', label: '📊 Quality' },
    { id: 'stability', label: '🧫 Stability' },
    { id: 'fourEngine', label: '🔬 4-Engine' },
    { id: 'history', label: '📜 History' }
  ];

  const tabButtons = tabs.map(t =>
    '<button class="recipe-detail-tab px-3 py-2 text-sm font-semibold border-b-2 ' +
    (RECIPE_APP.activeTab === t.id ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600 hover:text-blue-600') +
    '" data-tab="' + t.id + '">' + t.label + '</button>'
  ).join('');

  const statusCls = recipe.status === 'Approved' ? 'badge-ok' :
                    recipe.status === 'Archived' ? 'badge-infeasible' : 'badge-Medium';

  const header =
    '<div class="flex flex-wrap justify-between items-start gap-2 mb-3 p-3 bg-blue-50 rounded border border-blue-200">' +
    '  <div class="flex-1">' +
    '    <div class="font-bold text-lg">' + escapeHtml(recipe.recipeName) +
    (RECIPE_APP.isOwner ? ' <button id="btnEditNotes" class="text-xs text-blue-600 hover:underline ml-2 font-normal">✏️ Edit Nama/Catatan</button>' : '') +
    '</div>' +
    '    <div class="text-xs text-gray-600 mt-1">' +
    '      <b>' + escapeHtml(recipe.recipeId) + '</b> · v' + (recipe.version || 1) + ' · ' +
    '      Produk: <b>' + escapeHtml(recipe.productId || '-') + '</b>' +
    (recipe.productName ? ' — ' + escapeHtml(recipe.productName) : '') + ' · ' +
    '      Kategori: <b>' + escapeHtml(recipe.bpomCategory || '-') + '</b> · ' +
    (RECIPE_APP.isOwner
      ? '      <button id="btnEditStatus" class="badge ' + statusCls + ' cursor-pointer hover:opacity-80" title="Klik untuk ubah status">' + escapeHtml(recipe.status) + ' ▼</button>'
      : '      <span class="badge ' + statusCls + '">' + escapeHtml(recipe.status) + '</span>') +
    '    </div>' +
    '    <div class="text-xs text-gray-500 mt-1">Dibuat: ' + escapeHtml((recipe.createdAt || '').replace('T', ' ').substring(0, 19)) + ' oleh ' + escapeHtml(recipe.createdBy) + '</div>' +
    '  </div>' +
    '  <div class="text-right flex flex-col gap-1">' +
    '    <button id="btnPrintRecipe" class="bg-gray-700 hover:bg-gray-600 text-white px-3 py-1.5 rounded text-xs font-medium">🖨️ Print</button>' +
    '    <button id="btnPublishSubRecipe" class="bg-teal-600 hover:bg-teal-500 text-white px-3 py-1.5 rounded text-xs font-medium" title="Jadikan resep ini sebagai bahan baku (RM)">📤 Publish as RM</button>' +
    (RECIPE_APP.isOwner
      ? '<button id="btnSaveAsVersion" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-1.5 rounded text-xs font-medium" title="Simpan sebagai versi baru">📌 Save as New Version</button>'
      : '') +
    '    <button id="btnCloneRecipe" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-xs font-medium" title="Duplikasi sebagai resep baru untuk revisi produk/kategori">📋 Clone & Revise</button>' +
    '  </div>' +
    '</div>';

  const body =
    header +
    '<div class="border-b mb-3 flex flex-wrap gap-1">' + tabButtons + '</div>' +
    '<div id="recipeDetailTabContent"></div>';

  openModal('📋 Detail Resep — ' + recipe.recipeId + ' (' + recipe.recipeName + ')', body);
    // Bind header actions
  const btnEditStatus = document.getElementById('btnEditStatus');
  if (btnEditStatus) {
    btnEditStatus.addEventListener('click', () => showStatusEditDialog(recipe));
  }
  const btnEditNotes = document.getElementById('btnEditNotes');
  if (btnEditNotes) {
    btnEditNotes.addEventListener('click', () => showNotesEditDialog(recipe));
  }
  const btnSaveAsVersion = document.getElementById('btnSaveAsVersion');
  if (btnSaveAsVersion) {
    btnSaveAsVersion.addEventListener('click', () => showSaveAsVersionDialog(recipe));
  }
  const btnPrint = document.getElementById('btnPrintRecipe');
  if (btnPrint) {
    btnPrint.addEventListener('click', () => showPrintDialog(recipe));
  }
  const btnPublish = document.getElementById('btnPublishSubRecipe');
  if (btnPublish) {
    btnPublish.addEventListener('click', async () => {
      if (!confirm('Publish resep ini sebagai Sub-Resep (Raw Material)?\n\nNutrisi dan harga akan dihitung otomatis.')) return;
      btnPublish.disabled = true; btnPublish.textContent = '⏳ Publishing...';
      try {
        const res = await callApi('api_publishSubRecipe', [recipe.recipeId], 30000);
        if (!res || !res.ok) throw new Error(res.error);
        showToast('✅ ' + res.message, 'success');
        await loadInitialData(true); // Refresh data RM agar sub-resep muncul di Optimizer
      } catch (e) {
        showToast('Gagal: ' + e.message, 'error');
      } finally {
        btnPublish.disabled = false; btnPublish.textContent = '📤 Publish as RM';
      }
    });
  }
  const btnClone = document.getElementById('btnCloneRecipe');
  if (btnClone) {
    btnClone.addEventListener('click', () => {
      if (!confirm('Duplikasi resep ini sebagai DRAFT baru?\n\nGunakan fitur ini jika ingin mengubah Produk atau Kategori BPOM. Resep asli tidak akan berubah.')) return;
      
      // Panggil API manual create (karena strukturnya sama dengan membuat resep baru)
      // Kita gunakan komposisi yang ada, tapi kosongkan target agar user bisa pilih ulang
      const clonePayload = {
        recipeName: recipe.recipeName + ' (Revisi)',
        productId: null, // Dikosongkan agar user wajib pilih produk baru
        composition: recipe.composition,
        notes: 'Hasil clone dari ' + recipe.recipeId + '. Alasan revisi: ...',
        waterParams: recipe.waterParams
      };
      
      callApi('api_createManualRecipe', [clonePayload], 30000).then(res => {
        if (res && res.ok) {
          showToast('✅ Clone berhasil. Silakan edit Produk & Kategori di resep baru.', 'success');
          closeModal();
          loadRecipeBankList(true).then(() => {
            setTimeout(() => showRecipeBankDetailModal(res.recipeId), 500);
          });
        } else {
          showToast('Gagal clone: ' + (res && res.error), 'error');
        }
      });
    });
  }
  document.querySelectorAll('.recipe-detail-tab').forEach(btn => {
    btn.addEventListener('click', function () {
      RECIPE_APP.activeTab = btn.dataset.tab;
      renderRecipeBankDetailModal();
    });
  });

  renderRecipeDetailTabContent();
}

function renderRecipeDetailTabContent() {
  const container = document.getElementById('recipeDetailTabContent');
  if (!container) return;
  const recipe = RECIPE_APP.detail;
  if (!recipe) { container.innerHTML = ''; return; }

  if (RECIPE_APP.activeTab === 'recipe') {
    container.innerHTML = renderRecipeDetailRecipeTab(recipe);
  } else if (RECIPE_APP.activeTab === 'process') {
    container.innerHTML = renderRecipeDetailProcessTab(recipe);
    bindProcessTabEvents(recipe);
  } else if (RECIPE_APP.activeTab === 'nutrition') {
    container.innerHTML = renderRecipeDetailNutritionTab(recipe);
  } else if (RECIPE_APP.activeTab === 'labeling') {
    container.innerHTML = renderRecipeDetailLabelingTab(recipe);
    bindLabelTabEvents();
  } else if (RECIPE_APP.activeTab === 'quality') {
    container.innerHTML = renderRecipeDetailQualityTab(recipe);
    bindQualityTabEvents(recipe);
  } else if (RECIPE_APP.activeTab === 'stability') {
    container.innerHTML = renderRecipeDetailStabilityTab(recipe);
    bindStabilityTabEvents(recipe);
  } else if (RECIPE_APP.activeTab === 'fourEngine') {
    container.innerHTML = renderRecipeDetailFourEngineTab(recipe);
    if (typeof bindHeatmapInteractions === 'function') bindHeatmapInteractions();
  } else if (RECIPE_APP.activeTab === 'history') {
    renderHistoryTab(container, recipe);
  }
}

function bindLabelTabEvents() {
  document.querySelectorAll('.label-option-tab').forEach(btn => {
    btn.addEventListener('click', function () {
      const optId = btn.dataset.optid;
      // Update kelas tab aktif
      document.querySelectorAll('.label-option-tab').forEach(b => {
        const active = b.dataset.optid === optId;
        b.className = 'label-option-tab px-2 py-1 text-xs rounded border ' +
          (active ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 hover:bg-gray-100 border-gray-200');
      });
      // Toggle visibility semua konten
      document.querySelectorAll('.label-option-content').forEach(el => {
        el.style.display = (el.id === 'labelContent_' + optId) ? '' : 'none';
      });
    });
  });
}

// ============================================================
// TAB 1: RECIPE & COST
// ============================================================
function renderRecipeDetailRecipeTab(recipe) {
  const hpp = recipe.hpp || {};
  const breakdown = hpp.breakdown || [];
  const product = APP.data.products.find(p => p.productId === recipe.productId);
  const density = (product && product.density) || 1.03;

  let totalPct = 0, totalGram = 0, totalRp = 0;
  const rows = breakdown.map(b => {
    totalPct += (b.pct || 0);
    totalGram += (b.pct || 0) * density;
    totalRp += (b.contribution || 0);
    const rpPct = (hpp.perKg || 0) > 0 ? (b.contribution / hpp.perKg) * 100 : 0;
    return '<tr class="border-b">' +
      '<td class="py-1 px-1 text-xs">' + escapeHtml(b.rmid) + '</td>' +
      '<td class="py-1 px-1 text-xs">' + escapeHtml(b.name || '') + '</td>' +
      '<td class="py-1 px-1 text-xs text-center">' + fmtNum(b.pct, 2) + '%</td>' +
      '<td class="py-1 px-1 text-xs text-center">' + fmtNum((b.pct || 0) * density, 3) + '</td>' +
      '<td class="py-1 px-1 text-xs text-right">' + fmtRp(b.pricePerKg) + '</td>' +
      '<td class="py-1 px-1 text-xs text-right">' + fmtRp(b.contribution) + '</td>' +
      '<td class="py-1 px-1 text-xs text-center">' + fmtNum(rpPct, 2) + '%</td>' +
      '</tr>';
  }).join('');

  let notesHtml = '';
  if (recipe.notes) {
    notesHtml = '<div class="mt-3 p-2 bg-yellow-50 border border-yellow-200 rounded text-sm">' +
      '<div class="font-semibold text-xs text-yellow-900 mb-1">Catatan</div>' +
      '<div class="text-xs whitespace-pre-wrap">' + escapeHtml(recipe.notes) + '</div>' +
      '</div>';
  }

  return (
    '<h3 class="font-semibold mb-2">Komposisi Resep</h3>' +
    '<div class="overflow-x-auto">' +
    '<table class="w-full text-sm">' +
    '<thead><tr class="bg-gray-100">' +
    '<th class="text-left py-1 px-1 text-xs">RMID</th>' +
    '<th class="text-left py-1 px-1 text-xs">Nama RM</th>' +
    '<th class="text-center py-1 px-1 text-xs">%</th>' +
    '<th class="text-center py-1 px-1 text-xs">g/100ml</th>' +
    '<th class="text-right py-1 px-1 text-xs">Harga/kg</th>' +
    '<th class="text-right py-1 px-1 text-xs">Kontribusi</th>' +
    '<th class="text-center py-1 px-1 text-xs">%Rp</th>' +
    '</tr></thead>' +
    '<tbody>' + (rows || '<tr><td colspan="7" class="text-center text-xs text-gray-500 py-3">Tidak ada komposisi.</td></tr>') + '</tbody>' +
    '<tfoot><tr class="font-bold bg-gray-50">' +
    '<td colspan="2" class="py-1 px-1 text-xs">TOTAL</td>' +
    '<td class="py-1 px-1 text-xs text-center">' + fmtNum(totalPct, 2) + '%</td>' +
    '<td class="py-1 px-1 text-xs text-center">' + fmtNum(totalGram, 2) + '</td>' +
    '<td></td>' +
    '<td class="py-1 px-1 text-xs text-right">' + fmtRp(totalRp) + '</td>' +
    '<td class="py-1 px-1 text-xs text-center">' + (totalRp > 0 ? '100%' : '-') + '</td>' +
    '</tr></tfoot>' +
    '</table></div>' +
    '<div class="mt-3 p-3 bg-blue-50 rounded text-sm">' +
    '  <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">' +
    '    <div><span class="text-gray-600">HPP/kg:</span> <b>' + fmtRp(hpp.perKg) + '</b></div>' +
    '    <div><span class="text-gray-600">HPP/L:</span> <b>' + fmtRp(hpp.perLiter) + '</b></div>' +
    '    <div><span class="text-gray-600">HPP/saji (200ml):</span> <b>' + fmtRp(hpp.perSaji) + '</b></div>' +
    '    <div><span class="text-gray-600">Density:</span> <b>' + fmtNum(density, 3) + '</b></div>' +
    '  </div>' +
    '</div>' +
    notesHtml
  );
}

// ============================================================
// TAB 2: NUTRISI (LENGKAP — Makro + Mikro + Nutri-Level + Pilihan Sehat)
// ============================================================
function renderRecipeDetailNutritionTab(recipe) {
  const actual = recipe.actualNutrition || {};
  const target = recipe.targetNutrition || {};
  const nl = recipe.nutriLevel || {};
  const ps = recipe.pilihanSehat || {};
  const premix = recipe.premixRecommendation || {};

  // ---- 1. MAKRO VS TARGET ----
  const MACRO_DEFS = [
    { key: 'protein', label: 'Protein', unit: 'g/100ml', tMin: 'proteinMin', tMax: 'proteinMax' },
    { key: 'fatTotal', label: 'Lemak Total', unit: 'g/100ml', tMin: 'fatMin', tMax: 'fatMax' },
    { key: 'snf', label: 'SNF (MSNF)', unit: 'g/100ml', tMin: 'snfMin', tMax: null },
    { key: 'sugarTotal', label: 'Gula Total', unit: 'g/100ml', tMin: null, tMax: 'sugarMax' },
    { key: 'sucrose', label: 'Sukrosa', unit: 'g/100ml', tMin: null, tMax: 'sucroseMax' },
    { key: 'sodium', label: 'Natrium', unit: 'mg/100ml', tMin: null, tMax: 'sodiumMax' },
    { key: 'saturatedFat', label: 'Lemak Jenuh', unit: 'g/100ml', tMin: null, tMax: null },
    { key: 'carbohydrateTotal', label: 'Karbohidrat', unit: 'g/100ml', tMin: null, tMax: null }
  ];

  const macroRows = MACRO_DEFS.map(m => {
    const val = safeNumLocal(actual[m.key]);
    let tgtLabel = '-', ok = null;
    const minV = m.tMin ? safeNumLocal(target[m.tMin]) : 0;
    const maxV = m.tMax ? safeNumLocal(target[m.tMax]) : 0;
    if (minV > 0 && maxV > 0) { tgtLabel = fmtNum(minV, 2) + '–' + fmtNum(maxV, 2); ok = val >= minV - 0.01 && val <= maxV + 0.01; }
    else if (minV > 0) { tgtLabel = '≥ ' + fmtNum(minV, 2); ok = val >= minV - 0.01; }
    else if (maxV > 0) { tgtLabel = '≤ ' + fmtNum(maxV, 2); ok = val <= maxV + 0.01; }
    const mark = ok === null ? '<span class="text-gray-400">—</span>' :
                 ok ? '<span class="text-green-600 font-bold">✓</span>' :
                      '<span class="text-red-600 font-bold">✗</span>';
    return '<tr class="border-b"><td class="py-1 px-1 text-xs">' + escapeHtml(m.label) + '</td>' +
      '<td class="py-1 px-1 text-xs text-right font-semibold">' + fmtNum(val, 2) + ' <span class="text-gray-500">' + escapeHtml(m.unit) + '</span></td>' +
      '<td class="py-1 px-1 text-xs text-center">' + tgtLabel + '</td>' +
      '<td class="py-1 px-1 text-xs text-center">' + mark + '</td></tr>';
  }).join('');

  const macroHtml =
    '<h3 class="font-semibold mb-2">1. Makronutrien vs Target</h3>' +
    '<table class="w-full mb-4"><thead><tr class="bg-gray-100">' +
    '<th class="text-left py-1 px-1 text-xs">Nutrisi</th>' +
    '<th class="text-right py-1 px-1 text-xs">Aktual</th>' +
    '<th class="text-center py-1 px-1 text-xs">Target</th>' +
    '<th class="text-center py-1 px-1 text-xs">Status</th>' +
    '</tr></thead><tbody>' + macroRows + '</tbody></table>';

  // ---- 2. MIKRONUTRIEN VS TARGET (LENGKAP) ----
  const allMicro = []
    .concat((premix.gaps || []).map(g => Object.assign({}, g, { _type: 'gap' })))
    .concat((premix.satisfied || []).map(s => Object.assign({}, s, { _type: 'satisfied' })));

  // Sort: gap dulu (urut gapPctAKG desc), lalu satisfied (urut nativePctAKG desc)
  allMicro.sort((a, b) => {
    if (a._type !== b._type) return a._type === 'gap' ? -1 : 1;
    if (a._type === 'gap') return (b.gapPctAKG || 0) - (a.gapPctAKG || 0);
    return (b.nativePctAKG || 0) - (a.nativePctAKG || 0);
  });

  let microHtml = '<h3 class="font-semibold mb-2 mt-4">2. Mikronutrien vs Target</h3>';

  if (allMicro.length === 0) {
    microHtml += '<div class="p-2 bg-gray-50 text-xs rounded mb-3 text-gray-500">Belum ada data mikronutrien (target produk mungkin tidak menetapkan %AKG untuk mikro).</div>';
  } else {
    // Header summary
    microHtml += '<div class="mb-2 p-2 bg-blue-50 rounded text-xs">' +
      '<b>Total dicek:</b> ' + allMicro.length + ' · ' +
      '<span class="text-red-600 font-semibold">' + (premix.gaps || []).length + ' perlu premix</span> · ' +
      '<span class="text-green-600 font-semibold">' + (premix.satisfied || []).length + ' sudah sesuai</span>' +
      '</div>';

    // Premix recommendation box (jika ada gap)
    if (premix.premixId && premix.premixDoseGPer1000L > 0) {
      microHtml += '<div class="mb-3 p-3 bg-amber-50 border border-amber-200 rounded text-xs">' +
        '<div class="font-bold text-amber-900 text-sm mb-1">💊 Rekomendasi Fortifikasi Premix (+10% overage):</div>' +
        '<div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-slate-700 mb-1">' +
        '<div><span class="text-gray-500">Premix:</span> <b class="text-blue-800">' + escapeHtml(premix.premixId) + '</b></div>' +
        '<div><span class="text-gray-500">Dosis Batch:</span> <b>' + fmtNum(premix.premixDoseGPer1000L, 1) + ' g / 1000 L</b></div>' +
        '<div><span class="text-gray-500">Dosis/saji:</span> <b>' + fmtNum(premix.premixDoseMgPerSaji, 1) + ' mg</b></div>' +
        '<div><span class="text-gray-500">Biaya:</span> <b>Rp ' + fmtNum(premix.premixCostPerLiter, 2) + ' / L</b></div>' +
        '</div>' +
        (premix.limitingNutrient ? '<div class="text-[11px] text-amber-800">Limiting nutrient: <b>' + escapeHtml(premix.limitingNutrient) + '</b> (' + fmtNum(premix.premixDosePct, 4) + '% w/w)</div>' : '') +
        '</div>';
    }

    // Table lengkap
    const microRows = allMicro.map(g => {
      const isGap = g._type === 'gap';
      const rowCls = isGap ? 'bg-red-50' : '';
      const statusCell = isGap
        ? '<span class="text-red-600 font-bold">✗</span>'
        : '<span class="text-green-600 font-bold">✓</span>';
      const gapVal = isGap ? (g.gapPerServing !== undefined ? g.gapPerServing : g.gap) : 0;
      return '<tr class="border-b ' + rowCls + '">' +
        '<td class="py-1 px-1 text-xs">' + escapeHtml(g.label || g.key) + '</td>' +
        '<td class="py-1 px-1 text-xs text-center font-semibold">' + fmtNum(g.targetPctAKG, 1) + '%</td>' +
        '<td class="py-1 px-1 text-xs text-center ' + (isGap ? 'text-red-600' : 'text-green-700') + '">' + fmtNum(g.nativePctAKG, 1) + '%</td>' +
        '<td class="py-1 px-1 text-xs text-center">' + fmtNum(g.targetPerServing !== undefined ? g.targetPerServing : g.target, 2) + '</td>' +
        '<td class="py-1 px-1 text-xs text-center">' + fmtNum(g.nativePerServing !== undefined ? g.nativePerServing : g.native, 2) + '</td>' +
        '<td class="py-1 px-1 text-xs text-center ' + (isGap ? 'text-red-600 font-semibold' : 'text-gray-400') + '">' + (isGap ? fmtNum(gapVal, 2) : '—') + '</td>' +
        '<td class="py-1 px-1 text-xs text-center text-gray-500">' + escapeHtml(g.unit || '') + '</td>' +
        '<td class="py-1 px-1 text-xs text-center">' + statusCell + '</td>' +
        '</tr>';
    }).join('');

    microHtml +=
      '<table class="w-full mb-3"><thead><tr class="bg-gray-100">' +
      '<th class="text-left py-1 px-1 text-xs">Nutrisi</th>' +
      '<th class="text-center py-1 px-1 text-xs">Target %AKG</th>' +
      '<th class="text-center py-1 px-1 text-xs">Native %AKG</th>' +
      '<th class="text-center py-1 px-1 text-xs">Target/saji</th>' +
      '<th class="text-center py-1 px-1 text-xs">Native/saji</th>' +
      '<th class="text-center py-1 px-1 text-xs">Gap/saji</th>' +
      '<th class="text-center py-1 px-1 text-xs">Unit</th>' +
      '<th class="text-center py-1 px-1 text-xs">Status</th>' +
      '</tr></thead><tbody>' + microRows + '</tbody></table>' +
      '<p class="text-[10px] text-gray-500 mb-4">Basis per takaran saji (default 200ml). Merah = perlu premix fortifikasi · Hijau = sudah memenuhi target.</p>';
  }

  // ---- 3. NUTRI-LEVEL DETAIL (TABEL LENGKAP) ----
  const nlDetails = nl.details || {};
  // Backend menyimpan key: sugarTotal, sodium, fatTotal (dari gradeNutriLevel_)
  // UI lama cari key: NonLactoseSugar, Sodium, FatTotal — tidak cocok. Fix:
  const nlSugar = nlDetails.sugarTotal || nlDetails.NonLactoseSugar || null;
  const nlSodium = nlDetails.sodium || nlDetails.Sodium || null;
  const nlFat = nlDetails.fatTotal || nlDetails.FatTotal || null;

  // Ambil nilai batas dari APP.data.nutriLevelRules
  const nlRules = (APP.data.nutriLevelRules || []);
  const ruleByKey = {};
  nlRules.forEach(r => { ruleByKey[r.nutrient] = r; });
  const rSugar = ruleByKey['sugarTotal'] || {};
  const rSodium = ruleByKey['sodium'] || {};
  const rFat = ruleByKey['fatTotal'] || {};

  // Cek exemption untuk Plain
  const isPlainExempt = recipe.bpomCategory === 'Plain';

  const nlRows =
    '<tr class="border-b">' +
    '  <td class="py-1 px-1 text-xs">Gula Total</td>' +
    '  <td class="py-1 px-1 text-xs text-right font-semibold">' + fmtNum(nlSugar ? nlSugar.value : safeNumLocal(actual.sugarTotal), 2) + ' g/100ml</td>' +
    '  <td class="py-1 px-1 text-xs text-center">≤ ' + fmtNum(rSugar.gradeAMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">&gt; ' + fmtNum(rSugar.gradeAMax, 1) + ' – ' + fmtNum(rSugar.gradeBMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">&gt; ' + fmtNum(rSugar.gradeBMax, 1) + ' – ' + fmtNum(rSugar.gradeCMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">&gt; ' + fmtNum(rSugar.gradeCMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">' + gradeBadge(nlSugar ? nlSugar.grade : '-') + '</td>' +
    '</tr>' +
    '<tr class="border-b">' +
    '  <td class="py-1 px-1 text-xs">Natrium</td>' +
    '  <td class="py-1 px-1 text-xs text-right font-semibold">' + fmtNum(nlSodium ? nlSodium.value : safeNumLocal(actual.sodium), 2) + ' mg/100ml</td>' +
    '  <td class="py-1 px-1 text-xs text-center">≤ ' + fmtNum(rSodium.gradeAMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">&gt; ' + fmtNum(rSodium.gradeAMax, 1) + ' – ' + fmtNum(rSodium.gradeBMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">&gt; ' + fmtNum(rSodium.gradeBMax, 1) + ' – ' + fmtNum(rSodium.gradeCMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">&gt; ' + fmtNum(rSodium.gradeCMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">' + gradeBadge(nlSodium ? nlSodium.grade : '-') + '</td>' +
    '</tr>' +
    '<tr class="border-b ' + (isPlainExempt ? 'bg-green-50' : '') + '">' +
    '  <td class="py-1 px-1 text-xs">Lemak Total ' + (nlFat && nlFat.isExempt ? '<span class="text-[9px] bg-green-100 text-green-700 px-1 rounded">Dikecualikan</span>' : '') + '</td>' +
    '  <td class="py-1 px-1 text-xs text-right font-semibold">' + fmtNum(nlFat ? nlFat.value : safeNumLocal(actual.fatTotal), 2) + ' g/100ml</td>' +
    '  <td class="py-1 px-1 text-xs text-center">≤ ' + fmtNum(rFat.gradeAMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">&gt; ' + fmtNum(rFat.gradeAMax, 1) + ' – ' + fmtNum(rFat.gradeBMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">&gt; ' + fmtNum(rFat.gradeBMax, 1) + ' – ' + fmtNum(rFat.gradeCMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">&gt; ' + fmtNum(rFat.gradeCMax, 1) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">' + gradeBadge(nlFat ? nlFat.grade : '-') + '</td>' +
    '</tr>';

  const nlHtml =
    '<h3 class="font-semibold mb-2 mt-4">3. Nutri-Level Detail</h3>' +
    '<div class="mb-2 text-sm">Overall: ' + gradeBadge(nl.overall) + '</div>' +
    '<table class="w-full mb-4"><thead><tr class="bg-gray-100">' +
    '<th class="text-left py-1 px-1 text-xs">Nutrisi</th>' +
    '<th class="text-right py-1 px-1 text-xs">Nilai</th>' +
    '<th class="text-center py-1 px-1 text-xs">A (≤)</th>' +
    '<th class="text-center py-1 px-1 text-xs">B</th>' +
    '<th class="text-center py-1 px-1 text-xs">C</th>' +
    '<th class="text-center py-1 px-1 text-xs">D (&gt;)</th>' +
    '<th class="text-center py-1 px-1 text-xs">Grade</th>' +
    '</tr></thead><tbody>' + nlRows + '</tbody></table>' +
    '<p class="text-[10px] text-gray-500 mb-4">Sumber batas: sheet <code>nutri_level_criteria</code>. Plain full cream dikecualikan dari grade Lemak.</p>';

  // ---- 4. PILIHAN SEHAT DETAIL (TABEL LENGKAP) ----
  const psChecks = ps.checks || {};
  const psSugar = psChecks.sugar || {};
  const psSweetener = psChecks.sweetener || { pass: true };

  const psRows =
    '<tr class="border-b">' +
    '  <td class="py-1 px-1 text-xs">Gula (Non-Laktosa)</td>' +
    '  <td class="py-1 px-1 text-xs text-right font-semibold">' + fmtNum(psSugar.value !== undefined ? psSugar.value : safeNumLocal(actual.sugarTotal), 2) + ' g/100ml</td>' +
    '  <td class="py-1 px-1 text-xs text-center">≤ ' + fmtNum(psSugar.max, 2) + '</td>' +
    '  <td class="py-1 px-1 text-xs text-center">' +
    (psSugar.pass ? '<span class="text-green-600 font-bold">✓</span>' : '<span class="text-red-600 font-bold">✗</span>') +
    '  </td>' +
    '</tr>' +
    '<tr class="border-b">' +
    '  <td class="py-1 px-1 text-xs">BTP Pemanis</td>' +
    '  <td class="py-1 px-1 text-xs text-right font-semibold">Tidak boleh ada</td>' +
    '  <td class="py-1 px-1 text-xs text-center">—</td>' +
    '  <td class="py-1 px-1 text-xs text-center">' +
    (psSweetener.pass ? '<span class="text-green-600 font-bold">✓</span>' : '<span class="text-red-600 font-bold">✗</span>') +
    '  </td>' +
    '</tr>';

  const psHtml =
    '<h3 class="font-semibold mb-2 mt-4">4. Pilihan Lebih Sehat</h3>' +
    '<div class="mb-2 text-sm">' + (ps.pass ? '<span class="badge badge-ok">✓ LOLOS</span>' : '<span class="badge badge-fail">✗ TIDAK LOLOS</span>') + '</div>' +
    '<table class="w-full mb-3"><thead><tr class="bg-gray-100">' +
    '<th class="text-left py-1 px-1 text-xs">Kriteria</th>' +
    '<th class="text-right py-1 px-1 text-xs">Nilai</th>' +
    '<th class="text-center py-1 px-1 text-xs">Batas</th>' +
    '<th class="text-center py-1 px-1 text-xs">Status</th>' +
    '</tr></thead><tbody>' + psRows + '</tbody></table>' +
    (ps.reasons && ps.reasons.length > 0
      ? '<ul class="text-xs list-disc ml-4 text-red-700 mb-4">' + ps.reasons.map(r => '<li>' + escapeHtml(r) + '</li>').join('') + '</ul>'
      : '<div class="mb-4"></div>');

  return macroHtml + microHtml + nlHtml + psHtml;
}

// ============================================================
// TAB: PROCESS PROCEDURE
// ============================================================
function renderRecipeDetailProcessTab(recipe) {
  const steps = Array.isArray(recipe.processProcedure) ? recipe.processProcedure : [];
  const isOwner = RECIPE_APP.isOwner;

  // --- Tampilan Read-Only (Bukan Pemilik) ---
  if (!isOwner) {
    if (steps.length === 0) return '<div class="p-3 bg-gray-50 rounded text-xs text-gray-500">Belum ada process procedure.</div>';
    const rows = steps.map(s =>
      '<tr class="border-b">' +
      '<td class="py-1 px-2 text-xs text-center font-mono">' + (s.step || '-') + '</td>' +
      '<td class="py-1 px-2 text-xs">' + escapeHtml(s.name || '') + '</td>' +
      '<td class="py-1 px-2 text-xs text-gray-700">' + escapeHtml(s.parameter || (s.temp && s.time ? (s.temp + ' · ' + s.time) : '-')) + '</td>' +
      '<td class="py-1 px-2 text-xs text-gray-600">' + escapeHtml(s.notes || '') + '</td>' +
      '</tr>'
    ).join('');
    return '<table class="w-full mb-3"><colgroup><col style="width:50px"><col style="width:22%"><col style="width:22%"><col style="width:auto"></colgroup>' +
      '<thead><tr class="bg-gray-100"><th class="text-center py-1 px-2 text-xs">#</th><th class="text-left py-1 px-2 text-xs">Deskripsi</th><th class="text-left py-1 px-2 text-xs">Parameter</th><th class="text-left py-1 px-2 text-xs">Catatan</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table>';
  }

  // --- Tampilan Editable (Pemilik) ---
  const rows = steps.map((s, idx) =>
    '<tr class="border-b proc-step-row" data-idx="' + idx + '">' +
    '<td class="py-1 px-1 text-center"><input type="number" class="proc-step-num w-12 border rounded px-1 py-0.5 text-xs text-center" value="' + (s.step || (idx + 1)) + '"></td>' +
    '<td class="py-1 px-1"><input type="text" class="proc-step-desc w-full border rounded px-1 py-0.5 text-xs" value="' + escapeHtml(s.name || '') + '"></td>' +

// MODAL PICKER: Pilih Resep (Search + Tabel)
// ============================================================
function showRecipePickerModal(title, excludeRecipeId, onSelectCallback) {
  // Buat container overlay baru agar tidak menimpa modal Detail yang sedang terbuka
  const overlayId = 'pickerOverlay';
  let overlay = document.getElementById(overlayId);
  if (overlay) overlay.remove();

  overlay = document.createElement('div');
  overlay.id = overlayId;
  overlay.className = 'modal-panel'; // Tetap pakai style modal-panel dari CSS Anda
  overlay.style.zIndex = '60';       // Pastikan di atas modal utama
  
  overlay.innerHTML = `
    <div class="modal-header bg-gray-800">
      <h2 class="text-lg font-bold">${escapeHtml(title)}</h2>
      <button onclick="document.getElementById('${overlayId}').remove()" class="text-2xl leading-none">&times;</button>
    </div>
    <div class="modal-body p-4">
      <div class="mb-3">
        <input id="pickSearch" type="text" class="form-input text-sm" placeholder="Cari nama atau ID resep...">
      </div>
      <div class="border rounded" style="max-height: 400px; overflow-y: auto;">
        <table class="w-full">
          <thead class="bg-gray-100 sticky top-0">
            <tr>
              <th class="text-left px-2 py-1 text-xs">ID</th>
              <th class="text-left px-2 py-1 text-xs">Nama Resep</th>
              <th class="text-center px-2 py-1 text-xs">Aksi</th>
            </tr>
          </thead>
          <tbody id="pickList">
            <tr><td colspan="3" class="text-center text-xs py-4 text-gray-500">Memuat...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="mt-4 flex justify-end">
        <button onclick="document.getElementById('${overlayId}').remove()" class="px-3 py-1.5 border rounded text-sm">Batal</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay); // Masukkan ke body, bukan ke modalContainer

  const renderList = (recipes) => {
    const tb = document.getElementById('pickList');
    if (!tb) return;
    if (recipes.length === 0) {
      tb.innerHTML = '<tr><td colspan="3" class="text-center text-xs py-4 text-gray-500">Tidak ada resep ditemukan.</td></tr>';
      return;
    }
    tb.innerHTML = recipes.map(r => `
      <tr class="border-b hover:bg-gray-50">
        <td class="px-2 py-1 text-xs font-mono">${escapeHtml(r.recipeId)}</td>
        <td class="px-2 py-1 text-xs">${escapeHtml(r.recipeName)}</td>
        <td class="px-2 py-1 text-center">
          <button class="btn-pick bg-blue-600 hover:bg-blue-500 text-white px-2 py-0.5 rounded text-[10px] font-medium" data-id="${r.recipeId}">Pilih</button>
        </td>
      </tr>
    `).join('');

    tb.querySelectorAll('.btn-pick').forEach(btn => {
      btn.addEventListener('click', () => {
        overlay.remove(); // Tutup overlay picker
        onSelectCallback(btn.dataset.id); // Jalankan aksi di modal utama
      });
    });
  };

  callApi('api_listRecipes', [{}], 15000).then(res => {
    if (!res || !res.ok) throw new Error(res.error || 'Gagal');
    let allRecipes = res.recipes || [];
    if (excludeRecipeId) {
      allRecipes = allRecipes.filter(r => r.recipeId !== excludeRecipeId);
    }
    renderList(allRecipes);

    document.getElementById('pickSearch').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = allRecipes.filter(r => 
        r.recipeName.toLowerCase().includes(q) || 
        r.recipeId.toLowerCase().includes(q)
      );
      renderList(filtered);
    });
  }).catch(e => {
    const tb = document.getElementById('pickList');
    if (tb) tb.innerHTML = `<tr><td colspan="3" class="text-red-600 text-xs p-2">${escapeHtml(e.message)}</td></tr>`;
  });
}

function bindProcessTabEvents(recipe) {
  if (!RECIPE_APP.isOwner) return;
  const body = document.getElementById('proc_body');

  // Helper: Render baris ke tabel dari array data
  function renderRowsToTable(stepsData) {
    if (!stepsData || stepsData.length === 0) return;
    body.innerHTML = stepsData.map((s, idx) =>
      '<tr class="border-b proc-step-row">' +
      '<td class="py-1 px-1 text-center"><input type="number" class="proc-step-num w-12 border rounded px-1 py-0.5 text-xs text-center" value="' + (s.step || idx+1) + '"></td>' +
      '<td class="py-1 px-1"><input type="text" class="proc-step-desc w-full border rounded px-1 py-0.5 text-xs" value="' + escapeHtml(s.name || '') + '"></td>' +
      '<td class="py-1 px-1"><input type="text" class="proc-step-param w-full border rounded px-1 py-0.5 text-xs" value="' + escapeHtml(s.parameter || (s.temp && s.time ? (s.temp+' · '+s.time) : '')) + '"></td>' +
      '<td class="py-1 px-1"><input type="text" class="proc-step-notes w-full border rounded px-1 py-0.5 text-xs" value="' + escapeHtml(s.notes || '') + '"></td>' +
      '<td class="py-1 px-1 text-center"><button class="proc-step-del text-red-600 hover:text-red-800 text-xs">✕</button></td>' +
      '</tr>'
    ).join('');
    bindAllDeletes();
  }

  function bindAllDeletes() {
    body.querySelectorAll('.proc-step-del').forEach(btn => {
      btn.onclick = (e) => { e.target.closest('tr').remove(); };
    });
  }
  bindAllDeletes();

  // --- Tombol 1: UHT Standard ---
  const btnUht = document.getElementById('btnUhtStandard');
  if (btnUht) {
    btnUht.onclick = () => {
      if (!confirm('Timpa process procedure saat ini dengan 8 Step Standard UHT?')) return;
      const stdSteps = [
        { step: 1, name: 'Persiapan Bahan Baku', temp: '20-25°C', time: '15 min', notes: 'Timbang bahan.' },
        { step: 2, name: 'Premixing Dry', temp: '25°C', time: '10 min', notes: 'Campur kering.' },
        { step: 3, name: 'Hydration', temp: '45-50°C', time: '30 min', notes: 'High-shear.' },
        { step: 4, name: 'Pre-heating', temp: '75-90°C', time: '60 s', notes: 'Plate HX.' },
        { step: 5, name: 'Homogenization', temp: '70-75°C', time: 'cont', notes: '2-stage.' },
        { step: 6, name: 'UHT Sterilization', temp: '138-142°C', time: '4 s', notes: 'Holding.' },
        { step: 7, name: 'Cooling', temp: '20-25°C', time: 'cont', notes: 'Segera.' },
        { step: 8, name: 'Aseptic Filling', temp: '20-25°C', time: 'cont', notes: 'Cek seal.' }
      ];
      renderRowsToTable(stdSteps);
      showToast('8 Step UHT Standard dimuat. Klik "Simpan Process" untuk menyimpan.', 'info');
    };
  }

  // --- Tombol 2: Copy Process ---
  const btnCopy = document.getElementById('btnCopyProcess');
  if (btnCopy) {
    btnCopy.onclick = () => {
      showRecipePickerModal('Copy Process Dari Resep Lain', recipe.recipeId, async (srcId) => {
        // Tampilkan loading di tabel utama
        const originalBody = body.innerHTML;
        body.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-sm text-gray-500">⏳ Mengambil dan menyimpan data proses...</td></tr>';
        
        try {
          const srcRes = await callApi('api_getRecipeDetail', [srcId], 20000);
          if (!srcRes || !srcRes.ok) throw new Error('Gagal ambil resep sumber');
          
          const srcSteps = srcRes.recipe.processProcedure || [];
          if (srcSteps.length === 0) throw new Error('Resep sumber tidak punya data Process.');
          
          // 1. Simpan ke Backend (Timpa data lama)
          const saveRes = await callApi('api_updateRecipe', [recipe.recipeId, { processProcedure: srcSteps }], 20000);
          if (!saveRes || !saveRes.ok) throw new Error(saveRes.error || 'Gagal menyimpan');
          
          // 2. Update State Frontend
          RECIPE_APP.detail.processProcedure = srcSteps;
          
          // 3. Render Ulang Tabel (tanpa keluar form)
          renderRowsToTable(srcSteps);
          showToast('✅ Process berhasil di-copy dan disimpan.', 'success');
          
        } catch (err) {
          body.innerHTML = originalBody; // Kembalikan tampilan jika error
          bindAllDeletes(); // Pastikan tombol hapus berfungsi lagi
          showToast(err.message, 'error');
        }
      });
    };
  }

  // --- Tombol Tambah Manual ---
  const btnAdd = document.getElementById('btnAddProcStep');
  if (btnAdd) {
    btnAdd.onclick = () => {
      const ph = document.getElementById('proc_placeholder');
      if (ph) ph.remove();
      const tr = document.createElement('tr');
      tr.className = 'border-b proc-step-row';
      tr.innerHTML = `
        <td class="py-1 px-1 text-center"><input type="number" class="proc-step-num w-12 border rounded px-1 py-0.5 text-xs text-center" value="${body.querySelectorAll('tr').length + 1}"></td>
        <td class="py-1 px-1"><input type="text" class="proc-step-desc w-full border rounded px-1 py-0.5 text-xs"></td>
        <td class="py-1 px-1"><input type="text" class="proc-step-param w-full border rounded px-1 py-0.5 text-xs"></td>
        <td class="py-1 px-1"><input type="text" class="proc-step-notes w-full border rounded px-1 py-0.5 text-xs"></td>
        <td class="py-1 px-1 text-center"><button class="proc-step-del text-red-600 hover:text-red-800 text-xs">✕</button></td>
      `;
      body.appendChild(tr);
      bindAllDeletes();
    };
  }

  // --- Tombol Simpan Process ---
  const btnSave = document.getElementById('btnSaveProc');
  if (btnSave) {
    btnSave.onclick = async () => {
      const rows = body.querySelectorAll('.proc-step-row');
      const steps = [];
      rows.forEach(tr => {
        const desc = tr.querySelector('.proc-step-desc').value.trim();
        if (!desc) return; // skip kosong
        steps.push({
          step: parseInt(tr.querySelector('.proc-step-num').value) || steps.length + 1,
          name: desc,
          parameter: tr.querySelector('.proc-step-param').value.trim(),
          notes: tr.querySelector('.proc-step-notes').value.trim()
        });
      });

      if (steps.length === 0) { showToast('Tidak ada step untuk disimpan', 'warn'); return; }

      btnSave.disabled = true; btnSave.textContent = '⏳ Menyimpan...';
      try {
        const res = await callApi('api_updateRecipe', [recipe.recipeId, { processProcedure: steps }], 20000);
        if (!res || !res.ok) throw new Error(res.error || 'Gagal');
        RECIPE_APP.detail.processProcedure = steps;
        showToast('✅ Process tersimpan', 'success');
        renderRecipeDetailTabContent(); 
      } catch (e) {
        showToast('Gagal: ' + e.message, 'error');
      } finally {
        btnSave.disabled = false; btnSave.textContent = '💾 Simpan Process';
      }
    };
  }
}

// TAB: LABELING (BPOM QUID)

function renderRecipeDetailLabelingTab(recipe) {
  const labelText = recipe.labelText || [];
  const bpomCategory = recipe.bpomCategory || '-';
  const isPlain = bpomCategory === 'Plain';
  const psPass = recipe.pilihanSehat && recipe.pilihanSehat.pass;
  const nlOverall = recipe.nutriLevel && recipe.nutriLevel.overall;

  // BPOM category & klaim
  const claimsHtml =
    '<div class="mb-3 p-3 bg-blue-50 rounded border border-blue-200 text-xs">' +
    '  <div class="mb-1"><b>Kategori BPOM:</b> <span class="badge ' + (isPlain ? 'badge-A' : 'badge-B') + '">' + escapeHtml(bpomCategory) + '</span></div>' +
    '  <div class="mb-1"><b>Nutri-Level Overall:</b> ' + (nlOverall ? gradeBadge(nlOverall) : '-') + '</div>' +
    '  <div><b>Klaim "Pilihan Lebih Sehat":</b> ' + (psPass ? '<span class="badge badge-ok">✓ Boleh diklaim</span>' : '<span class="badge badge-fail">✗ Tidak boleh</span>') + '</div>' +
    (psPass
      ? '<div class="mt-1 text-[11px] text-green-700">✓ Produk memenuhi kriteria BPOM Pilihan Lebih Sehat. Klaim dapat dicantumkan di kemasan.</div>'
      : '<div class="mt-1 text-[11px] text-red-700">✗ Perbaiki formula (gula ≤ batas kategori) untuk klaim Pilihan Lebih Sehat.</div>') +
    '</div>';

  // 4 opsi QUID
  let optionsHtml = '';
  if (!labelText || labelText.length === 0) {
    optionsHtml = '<div class="p-3 bg-yellow-50 border border-yellow-200 rounded text-xs text-yellow-800">' +
      '⚠️ Data label belum tersedia. Resep lama (sebelum update) tidak memiliki 4 opsi QUID.' +
      (RECIPE_APP.isOwner
        ? '<div class="mt-2"><button id="btnRegenLabel" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded text-xs font-medium">🔄 Generate Label Sekarang</button></div>'
        : '<div class="mt-1">Hubungi pemilik resep untuk regenerate.</div>') +
      '</div>';
  } else {
    // Render semua tab button
    const tabs = labelText.map((opt, i) => {
      const active = i === 0;
      return '<button class="label-option-tab px-2 py-1 text-xs rounded border ' +
        (active ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-gray-600 hover:bg-gray-100 border-gray-200') +
        '" data-target="labelContent_' + opt.id + '" data-optid="' + opt.id + '">' + escapeHtml(opt.title) + '</button>';
    }).join('');

    // Render SEMUA konten — hanya yang pertama terlihat
    const contents = labelText.map((opt, i) => {
      const visible = i === 0;
      return '<div id="labelContent_' + opt.id + '" class="label-option-content text-sm text-gray-800 bg-white p-3 border rounded leading-relaxed" style="' + (visible ? '' : 'display:none') + '">' + opt.text + '</div>';
    }).join('');

    optionsHtml =
      '<div class="mb-2 flex flex-wrap gap-1">' + tabs + '</div>' +
      contents +
      '<div class="mt-2 text-xs text-gray-500">' +
      '  Klik tab untuk melihat opsi penulisan label sesuai standar QUID (Quantitative Ingredient Declaration). ' +
      '  Semua opsi menyertakan alergen susu. Sesuaikan dengan format kemasan final.</div>';
  }

  // Bind regenerate button (jika ada) setelah render
  setTimeout(function () {
    var btn = document.getElementById('btnRegenLabel');
    if (btn) {
      btn.addEventListener('click', async function () {
        btn.disabled = true;
        btn.textContent = '⏳ Generating…';
        try {
          var res = await callApi('api_regenerateRecipeLabel', [recipe.recipeId], 20000);
          if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal regenerate');
          RECIPE_APP.detail.labelText = res.labelText;
          showToast('✅ Label berhasil di-generate', 'success');
          renderRecipeDetailTabContent();
        } catch (e) {
          showToast('Gagal: ' + e.message, 'error');
          btn.disabled = false;
          btn.textContent = '🔄 Generate Label Sekarang';
        }
      });
    }
  }, 0);

  return (
    '<h3 class="font-semibold mb-2">🏷️ Simulasi Teks Pelabelan (BPOM QUID)</h3>' +
    claimsHtml +
    '<h3 class="font-semibold mb-2 mt-3">4 Opsi Penulisan Komposisi</h3>' +
    optionsHtml
  );
}

  let processPreviewToken = 0;
  async function renderProcessPreview(productId) {
    const container = document.getElementById('mr_processPreview');
    if (!container) return;

    // Tentukan productType: dari produk target, atau default UHT
    let productType = 'UHT';
    let sourceLabel = 'default (tanpa produk target)';
    if (productId) {
      const prod = findProduct(productId);
      if (prod && prod.productType) {
        productType = prod.productType;
        sourceLabel = 'dari produk ' + prod.productId;
      }
    }

    const myToken = ++processPreviewToken;
    container.innerHTML =
      '<div class="p-2 bg-gray-50 border rounded text-xs text-gray-600">⏳ Memuat preview step proses (' +
      escapeHtml(productType) + ')…</div>';

    try {
      const res = await callApi('api_getProcessTemplate', [productType], 15000);
      if (myToken !== processPreviewToken) return; // ada request lebih baru, abaikan

      // Defensif: terima array langsung, {steps:[]}, atau {template:[]}
      let steps = [];
      if (Array.isArray(res)) steps = res;
      else if (res && Array.isArray(res.steps)) steps = res.steps;
      else if (res && Array.isArray(res.template)) steps = res.template;
      else if (res && res.ok === false) throw new Error(res.error || 'Gagal memuat template');

      if (steps.length === 0) {
        container.innerHTML =
          '<div class="p-2 bg-yellow-50 border border-yellow-200 rounded text-xs text-yellow-800">' +
          '⚠️ Template proses untuk <b>' + escapeHtml(productType) + '</b> kosong. ' +
          'Cek sheet <code>process_templates</code>.</div>';
        return;
      }

      const rows = steps.map((s, i) => {
        const stepNo = s.step !== undefined ? s.step : (i + 1);
        const name = s.name || s.stepName || '-';
        const param = s.parameter || '';
        const temp = s.temp || s.tempC || '';
        const time = s.time || s.timeMin || '';
        return '<tr class="border-b">' +
          '<td class="px-2 py-1 text-center text-xs font-semibold">' + escapeHtml(String(stepNo)) + '</td>' +
          '<td class="px-2 py-1 text-xs">' + escapeHtml(name) + '</td>' +
          '<td class="px-2 py-1 text-xs text-gray-600">' + escapeHtml(param) + '</td>' +
          '<td class="px-2 py-1 text-xs text-center">' + escapeHtml(String(temp)) + '</td>' +
          '<td class="px-2 py-1 text-xs text-center">' + escapeHtml(String(time)) + '</td>' +
          '</tr>';
      }).join('');

      container.innerHTML =
        '<div class="p-2 bg-indigo-50 border border-indigo-200 rounded">' +
        '<div class="flex justify-between items-center mb-1">' +
        '  <div class="text-xs font-bold text-indigo-900">🏭 Preview Step Proses — ' + escapeHtml(productType) + '</div>' +
        '  <div class="text-[10px] text-indigo-700">' + escapeHtml(sourceLabel) + ' · ' + steps.length + ' step</div>' +
        '</div>' +
        '<div class="overflow-x-auto bg-white rounded border">' +
        '<table class="w-full"><thead><tr class="bg-indigo-100 text-xs">' +
        '<th class="px-2 py-1 text-center w-8">#</th>' +
        '<th class="px-2 py-1 text-left">Step</th>' +
        '<th class="px-2 py-1 text-left">Parameter</th>' +
        '<th class="px-2 py-1 text-center">Temp</th>' +
        '<th class="px-2 py-1 text-center">Time</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<div class="text-[10px] text-indigo-700 mt-1">Step ini akan otomatis disimpan sebagai Process Procedure resep. ' +
        'Tidak dapat diedit di sini (ubah di sheet <code>process_templates</code> bila perlu).</div>' +
        '</div>';
    } catch (e) {
      if (myToken !== processPreviewToken) return;
      container.innerHTML =
        '<div class="p-2 bg-red-50 border border-red-200 rounded text-xs text-red-700">' +
        '⚠️ Gagal memuat preview proses: ' + escapeHtml(e.message) + '</div>';
    }
  }
  // ---- Logic rows ----

    tr.className = 'border-t';

      '    <div id="' + rowId + '" class="w-full"></div>' +

      '  </div>' +
      '</td>' +
      '<td class="px-2 py-1"><input type="number" step="0.01" min="0" max="100" class="mr-row-pct w-full border rounded px-1 py-0.5 text-xs text-center" value="' + (prefillPct || '') + '"></td>' +
      '<td class="px-2 py-1 text-center"><button class="mr-row-del text-red-600 hover:text-red-800 text-xs font-bold">✕</button></td>';
    tbody.appendChild(tr);

    const pctInput = tr.querySelector('.mr-row-pct');
    const rmidWrap = tr.querySelector('div[id^="rmWrap_"]');

            else payload[name] = inp.value;
          });

          const COL_MAP = {
            energyTotal: 'Energi (kcal)', protein: 'Protein (g)', fatTotal: 'Fat (g)',
            saturatedFat: 'Saturated Fat (g)', transFat: 'Trans Fat (g)', cholesterol: 'Cholesterol (mg)',
            linoleicAcid: 'Linoleic (mg)', alphaLinolenicAcid: 'Alpha-Linolenic (mg)',
            carbohydrateTotal: 'Karbohidrat (g)', dietaryFiber: 'Serat (g)', lactose: 'Laktosa (g)', sucrose: 'Sukrosa (g)', sugarTotal: 'Gula Total (g)',
            calcium: 'Ca (mg)', phosphorus: 'P (mg)', sodium: 'Natrium (mg)', potassium: 'Kalium (mg)', magnesium: 'Magnesium (mg)', iron: 'Besi (mg)',
            zinc: 'Seng (mg)', iodine: 'Iodium (mcg)', selenium: 'Selenium (mcg)',
            vitA: 'Vit A (IU)', vitD: 'Vit D (IU)', vitE: 'Vit E (mg)', vitK: 'Vit K (mcg)',
            vitB1: 'Vit B1 (mg)', vitB2: 'Vit B2 (mg)', vitB3: 'Vit B3 (mg)', vitB5: 'Vit B5 (mg)', vitB6: 'Vit B6 (mg)', folate: 'Folat (mcg)',
            vitB12: 'Vit B12 (mcg)', biotin: 'Biotin (mcg)', vitC: 'Vit C (mg)'
          };
          Object.keys(COL_MAP).forEach(k => { payload[COL_MAP[k]] = nutrients[k] || 0; });
          
          if (payload['Category'] && document.querySelector('.rm-tab-btn[data-tab="air"]')) {
             const WATER_COL_MAP = { waterHardness: 'Water Hardness (mg/L)', waterTds: 'Water TDS (mg/L)', waterCa: 'Water Ca (mg/L)', waterMg: 'Water Mg (mg/L)', waterPh: 'Water pH', waterIron: 'water_iron (mg/L)', waterAlkalinity: 'water_alkalinity (mg/L)' };
             Object.keys(WATER_COL_MAP).forEach(k => { if (waterParams[k] !== undefined) payload[WATER_COL_MAP[k]] = waterParams[k]; });

  function recalcTotal() {
    const body = document.getElementById('mr_compBody');
    let total = 0;
    const seen = {};
    let hasDup = false;
    body.querySelectorAll('tr').forEach(tr => {
      const rmid = tr.dataset.rmid;
      const pct = parseFloat(tr.querySelector('.mr-row-pct').value) || 0;
      if (rmid) {

      }
      total += pct;
    });

    const statusEl = document.getElementById('mr_totalStatus');

      cls += 'text-red-600'; msg = '⚠ Total harus 100% ± 0.5%';
    } else if (hasDup) {

      btn.disabled = false;
      btn.textContent = '💾 Simpan Resep';
    }
  });

// TAB: STABILITY TEST LOG
// ============================================================
function renderRecipeDetailStabilityTab(recipe) {
  const existingTests = recipe.stabilityTest || [];
  const isOwner = RECIPE_APP.isOwner;

  // Ambil fase dari uht_protocols (unik, urut D0 < D7 < D28 < D90 < D180)
  const protocols = (APP.data.uhtProtocols || []);
  const phaseSet = {};
  protocols.forEach(p => { if (p.testPhase) phaseSet[p.testPhase] = true; });
  let phases = Object.keys(phaseSet).sort((a, b) => {
    const da = parseInt((a.match(/\d+/) || [0])[0], 10);
    const db = parseInt((b.match(/\d+/) || [0])[0], 10);
    return da - db;
  });
  if (phases.length === 0) phases = ['D0', 'D28', 'D90', 'D180'];

  // Map tests per fase
  const testsByPhase = {};
  existingTests.forEach(t => {
    if (!testsByPhase[t.testPhase]) testsByPhase[t.testPhase] = [];
    testsByPhase[t.testPhase].push(t);
  });

  // Phase card
  const phaseCards = phases.map(phase => {
    const phaseTests = testsByPhase[phase] || [];
    const hasData = phaseTests.length > 0;

    // Hitung status ringkas
    let passCount = 0, failCount = 0, pendingCount = 0;
    phaseTests.forEach(t => {
      if (t.status === 'Pass') passCount++;
      else if (t.status === 'Fail') failCount++;
      else pendingCount++;
    });
    let summaryBadge = '<span class="badge badge-infeasible">Belum ada data</span>';
    if (hasData) {
      if (failCount > 0) summaryBadge = '<span class="badge badge-High">✗ ' + failCount + ' Fail</span>';
      else if (pendingCount > 0) summaryBadge = '<span class="badge badge-Medium">⏳ ' + pendingCount + ' Pending</span>';
      else summaryBadge = '<span class="badge badge-ok">✓ Semua Pass</span>';
    }

    const testRows = phaseTests.map((t, idx) => {
      const statusCls = t.status === 'Pass' ? 'badge-ok' : (t.status === 'Fail' ? 'badge-High' : 'badge-Medium');
      return '<tr class="border-b">' +
        '<td class="py-1 px-1 text-xs">' + escapeHtml(t.parameter || '-') + '</td>' +
        '<td class="py-1 px-1 text-xs text-center font-semibold">' + escapeHtml(String(t.value || '-')) + '</td>' +
        '<td class="py-1 px-1 text-xs text-center text-gray-600">' + escapeHtml(t.acceptanceCriteria || '-') + '</td>' +
        '<td class="py-1 px-1 text-center"><span class="badge ' + statusCls + '">' + escapeHtml(t.status) + '</span></td>' +
        '<td class="py-1 px-1 text-xs text-gray-500">' + escapeHtml(t.notes || '') + '</td>' +
        '</tr>';
    }).join('');

    return '<div class="border rounded mb-3 overflow-hidden">' +
      '<div class="bg-gray-50 px-3 py-2 flex justify-between items-center border-b">' +
      '  <div class="flex items-center gap-2">' +
      '    <span class="font-bold text-sm">' + escapeHtml(phase) + '</span>' +
      '    <span class="text-xs text-gray-500">' + phaseTests.length + ' parameter</span>' +
      '    ' + summaryBadge +
      '  </div>' +
      '  <div class="flex gap-2">' +
      '    <button class="btn-edit-phase text-blue-600 hover:underline text-xs font-semibold" data-phase="' + escapeHtml(phase) + '">' +
      (hasData ? '✏️ Edit' : '➕ Input') + '</button>' +
      (hasData && isOwner ? '    <button class="btn-del-phase text-red-600 hover:underline text-xs" data-phase="' + escapeHtml(phase) + '">🗑️</button>' : '') +
      '  </div>' +
      '</div>' +
      (hasData
        ? '<div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-gray-100 text-xs">' +
          '<th class="text-left px-2 py-1">Parameter</th>' +
          '<th class="text-center px-2 py-1">Nilai</th>' +
          '<th class="text-center px-2 py-1">Acceptance</th>' +
          '<th class="text-center px-2 py-1">Status</th>' +
          '<th class="text-left px-2 py-1">Catatan</th>' +
          '</tr></thead><tbody>' + testRows + '</tbody></table></div>'
        : '<div class="p-3 text-xs text-gray-500">Belum ada data uji untuk fase ' + escapeHtml(phase) + '.</div>') +
      '</div>';
  }).join('');

  return (
    '<h3 class="font-semibold mb-2">🧫 Stability Test Log (ASLT)</h3>' +
    '<p class="text-xs text-gray-500 mb-3">Catat hasil uji umur simpan per fase. Parameter & acceptance criteria otomatis dari sheet <code>uht_protocols</code>.</p>' +
    (isOwner ? '' : '<div class="p-2 bg-orange-50 border border-orange-200 rounded text-xs text-orange-700 mb-2">Read-only (bukan pemilik resep).</div>') +
    phaseCards
  );
}

// ============================================================
// AUTO PASS/FAIL EVALUATOR (parse acceptance criteria)
// ============================================================
function evaluateAcceptance_(valueStr, criteriaStr) {
  if (!valueStr || !criteriaStr) return 'Pending';
  const val = parseFloat(String(valueStr).replace(/[^\d.\-]/g, ''));
  if (isNaN(val)) return 'Pending'; // teks bebas (mis. "Tidak ada off-flavor") — serahkan manual

  const crit = String(criteriaStr).trim();

  // Range: "6.60 - 6.80" atau "6.60 – 6.80"
  const rangeMatch = crit.match(/([\d.]+)\s*[-–]\s*([\d.]+)/);
  if (rangeMatch) {
    const lo = parseFloat(rangeMatch[1]);
    const hi = parseFloat(rangeMatch[2]);
    if (!isNaN(lo) && !isNaN(hi)) {
      return (val >= lo && val <= hi) ? 'Pass' : 'Fail';
    }
  }

  // ≤ atau <=: "≤ 10 cP", "≤ 1 mm", "<= 0.1%"
  const leMatch = crit.match(/(?:≤|<=|<)\s*([\d.]+)/);
  if (leMatch) {
    const lim = parseFloat(leMatch[1]);
    if (!isNaN(lim)) {
      // kalau ada "≤", pakai <=; kalau "<", pakai < (strict)
      const isStrict = /</.test(crit) && !/≤/.test(crit) && !/<=/.test(crit);
      return (isStrict ? (val < lim) : (val <= lim)) ? 'Pass' : 'Fail';
    }
  }

  // ≥ atau >=: "≥ 30 mV", ">= 5"
  const geMatch = crit.match(/(?:≥|>=|>)\s*([\d.]+)/);
  if (geMatch) {
    const lim = parseFloat(geMatch[1]);
    if (!isNaN(lim)) {
      const isStrict = />/.test(crit) && !/≥/.test(crit) && !/>=/.test(crit);
      return (isStrict ? (val > lim) : (val >= lim)) ? 'Pass' : 'Fail';
    }
  }

  // "ΔVisc ≤ 2 cP" atau "ΔE ≤ 3.0" — ada delta
  const deltaMatch = crit.match(/Δ[\w]+\s*(?:≤|<=|<|≥|>=|>)\s*([\d.]+)/);
  if (deltaMatch) {
    const lim = parseFloat(deltaMatch[1]);
    if (!isNaN(lim) && Math.abs(val) <= lim) return 'Pass';
    else if (!isNaN(lim)) return 'Fail';
  }

  return 'Pending'; // format tidak dikenali — biarkan manual
}
