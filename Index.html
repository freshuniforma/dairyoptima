    // ============================================================
    // USER MANAGEMENT
    // ============================================================
    async function loadUsersTable() {
      const container = document.getElementById('usersTableContainer');
      if (!container) return;
      container.innerHTML = '<div class="text-xs text-gray-500">Memuat…</div>';
      try {
        const res = await callApi('api_listUsers', [], 15000);
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        const users = res.users || [];
        const currentEmail = (res.currentUser || '').toLowerCase();
        if (users.length === 0) {
          container.innerHTML = '<div class="text-xs text-gray-500 p-2 bg-gray-50 rounded">Belum ada user di sheet <code>users</code>.</div>';
          return;
        }
        const rows = users.map(u => {
          const activeBadge = u.isActive ? '<span class="badge badge-ok">Aktif</span>' : '<span class="badge badge-infeasible">Nonaktif</span>';
          const roleBadge = u.role === 'admin' ? '<span class="badge badge-B">Admin</span>' : '<span class="badge badge-Medium">User</span>';
          const isSelf = (u.email === currentEmail);
          return '<tr class="border-b hover:bg-gray-50">' +
            '<td class="px-2 py-1 text-xs">' + escapeHtml(u.email) + (isSelf ? ' <span class="text-[10px] text-blue-600 font-semibold">(Anda)</span>' : '') + '</td>' +
            '<td class="px-2 py-1 text-xs">' + escapeHtml(u.name || '-') + '</td>' +
            '<td class="px-2 py-1 text-center">' + roleBadge + '</td>' +
            '<td class="px-2 py-1 text-center">' + activeBadge + '</td>' +
            '<td class="px-2 py-1 text-xs text-gray-600">' + escapeHtml(u.notes || '') + '</td>' +
            '<td class="px-2 py-1 text-center whitespace-nowrap">' +
              '<button class="btn-edit-user text-blue-600 hover:underline text-xs font-semibold mr-2" data-email="' + escapeHtml(u.email) + '">Edit</button>' +
              (isSelf ? '' : '<button class="btn-del-user text-red-600 hover:underline text-xs" data-email="' + escapeHtml(u.email) + '">Nonaktifkan</button>') +
            '</td></tr>';
        }).join('');
        container.innerHTML = '<div class="overflow-x-auto"><table class="w-full"><thead><tr class="bg-gray-100 text-xs">' +
          '<th class="text-left px-2 py-1">Email</th><th class="text-left px-2 py-1">Nama</th>' +
          '<th class="text-center px-2 py-1">Role</th><th class="text-center px-2 py-1">Status</th>' +
          '<th class="text-left px-2 py-1">Catatan</th><th class="text-center px-2 py-1">Aksi</th>' +
          '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
          '<p class="text-xs text-gray-500 mt-2">Total ' + users.length + ' user · ' + users.filter(u => u.isActive).length + ' aktif</p>';
        container.querySelectorAll('.btn-edit-user').forEach(b => {
          b.addEventListener('click', () => showUserForm(b.dataset.email));
        });
        container.querySelectorAll('.btn-del-user').forEach(b => {
          b.addEventListener('click', () => deleteUser(b.dataset.email));
        });
      } catch (e) {
        container.innerHTML = '<div class="text-xs text-red-600">Gagal memuat user: ' + escapeHtml(e.message) + '</div>';
      }
    }

    async function showUserForm(email) {
      let existing = null;
      if (email) {
        try {
          const res = await callApi('api_listUsers', [], 15000);
          if (res && res.ok) existing = (res.users || []).find(u => u.email === email.toLowerCase());
        } catch (e) {}
      }
      const isEdit = !!existing;
      const u = existing || { email: '', name: '', role: 'user', isActive: true, notes: '' };
      const body =
        '<div class="modal-form-container">' +
        '  <div class="form-field-grid">' +
        '    <div class="form-field-item"><label class="form-label">Email *</label><input id="u_email" type="email" class="form-input" value="' + escapeHtml(u.email) + '"' + (isEdit ? ' readonly' : '') + ' placeholder="nama@email.com"></div>' +
        '    <div class="form-field-item"><label class="form-label">Nama</label><input id="u_name" type="text" class="form-input" value="' + escapeHtml(u.name) + '" placeholder="Nama lengkap"></div>' +
        '    <div class="form-field-item"><label class="form-label">Role</label><select id="u_role" class="form-input">' +
        '      <option value="user"' + (u.role === 'user' ? ' selected' : '') + '>User</option>' +
        '      <option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>Admin</option>' +
        '    </select></div>' +
        '    <div class="form-field-item"><label class="form-label">Status</label><label class="flex items-center gap-2 text-sm mt-1"><input id="u_active" type="checkbox"' + (u.isActive ? ' checked' : '') + '> Aktif</label></div>' +
        '    <div class="form-field-item col-span-full"><label class="form-label">Catatan</label><input id="u_notes" type="text" class="form-input" value="' + escapeHtml(u.notes) + '" placeholder="Departemen, jabatan, dll."></div>' +
        '  </div>' +
        '  <div class="mt-4 flex gap-2 justify-end">' +
        '    <button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Batal</button>' +
        '    <button id="btnSaveUser" class="px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white rounded text-sm font-medium">Simpan</button>' +
        '  </div>' +
        '</div>';
      openModal(isEdit ? 'Edit User — ' + u.email : 'Tambah User Baru', body);
      document.getElementById('btnSaveUser').addEventListener('click', async () => {
        const payload = {
          email: document.getElementById('u_email').value.trim().toLowerCase(),
          name: document.getElementById('u_name').value.trim(),
          role: document.getElementById('u_role').value,
          isActive: document.getElementById('u_active').checked,
          notes: document.getElementById('u_notes').value.trim()
        };
        if (!payload.email) { showToast('Email wajib diisi', 'warn'); return; }
        const btn = document.getElementById('btnSaveUser');
        btn.disabled = true; btn.textContent = '⏳ Menyimpan…';
        try {
          const res = await callApi('api_upsertUser', [payload], 15000);
          if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
          closeModal();
          showToast('User ' + payload.email + ' ' + (isEdit ? 'diupdate' : 'ditambahkan'), 'success');
          loadUsersTable();
        } catch (e) {
          showToast('Gagal: ' + e.message, 'error');
          btn.disabled = false; btn.textContent = 'Simpan';
        }
      });
    }

    async function deleteUser(email) {
      if (!confirm('Nonaktifkan user ' + email + '?\n\nUser tidak akan bisa login lagi. Untuk mengaktifkan kembali, gunakan Edit → centang "Aktif".')) return;
      try {
        const res = await callApi('api_deleteUser', [email], 15000);
        if (!res || !res.ok) throw new Error((res && res.error) || 'Gagal');
        showToast('User ' + email + ' dinonaktifkan', 'success');
        loadUsersTable();
      } catch (e) {
        showToast('Gagal: ' + e.message, 'error');
      }
    }

    // ============================================================
    // LABEL BPOM GENERATOR (fungsi helper — sama seperti existing)
    // ============================================================
    function generateLabelOptionsLocal(composition, rmList) {
      var rmMap = {};
      (rmList || []).forEach(function(rm) {
        if (!rm) return;
        if (rm.rmid) {
          rmMap[rm.rmid] = rm;
          rmMap[String(rm.rmid).trim().toUpperCase()] = rm;
        }
      });
      function isWaterRM(rm) {
        if (!rm) return false;
        var cat = String(rm.category || '').trim().toLowerCase();
        var name = String(rm.name || '').trim().toLowerCase();
        return cat === 'water' || cat === 'air' || name === 'air' || name.indexOf('air ') !== -1 || name.indexOf('water') !== -1;
      }
      function isRawMilkRM(rm) {
        if (!rm) return false;
        var cat = String(rm.category || '').trim().toLowerCase();
        var name = String(rm.name || '').trim().toLowerCase();
        return cat === 'raw milk' || cat === 'susu segar' || name.indexOf('susu segar') !== -1 || name.indexOf('raw milk') !== -1;
      }
      function isDairySolidRM(rm) {
        if (!rm) return false;
        if (isWaterRM(rm) || isRawMilkRM(rm)) return false;
        var cat = String(rm.category || '').trim().toLowerCase();
        var name = String(rm.name || '').trim().toLowerCase();
        if (cat === 'milk powder' || cat === 'dairy' || cat === 'dairy powder' || cat === 'fat' ||
            cat === 'milk fat' || cat === 'susu bubuk' || cat === 'whey' || cat === 'whey powder' ||
            cat === 'lemak susu' || cat === 'cream' || cat === 'krim' || cat.indexOf('dairy') !== -1 ||
            cat.indexOf('milk') !== -1 || cat.indexOf('susu') !== -1) {
          return true;
        }
        var dairyKeywords = ['skim','smp','fcmp','wmp','milk powder','susu bubuk','whey','swp','wpc','wpi','amf','anhydrous','butter','mentega','lemak susu','krim','cream','padatan susu','milk solid','kasein','casein','caseinate','laktosa','lactose','evaporasi','evaporated','buttermilk','bmp','mpc','mpi','permeate','permeat'];
        for (var i = 0; i < dairyKeywords.length; i++) if (name.indexOf(dairyKeywords[i]) !== -1) return true;
        return false;
      }
      function getRMBahanTS(rm) {
        var ts = safeNumLocal(rm.totalSolid);
        if (ts > 0) return ts;
        var moist = safeNumLocal(rm.moisture);
        if (moist > 0 && moist < 100) return 100 - moist;
        var fat = (rm.nutrients && safeNumLocal(rm.nutrients.fatTotal)) || 0;
        var snf = safeNumLocal(rm.snf);
        if (fat + snf > 0) return fat + snf;
        var name = String(rm.name || '').toLowerCase();
        var cat = String(rm.category || '').toLowerCase();
        if (name.indexOf('amf') !== -1 || name.indexOf('anhydrous') !== -1 || name.indexOf('butter oil') !== -1) return 99.8;
        if (name.indexOf('butter') !== -1 || name.indexOf('mentega') !== -1) return 84.0;
        if (name.indexOf('cream') !== -1 || name.indexOf('krim') !== -1) return 40.0;
        if (name.indexOf('evaporat') !== -1 || name.indexOf('evaporasi') !== -1) return 26.0;
        if (cat === 'milk powder' || name.indexOf('powder') !== -1 || name.indexOf('bubuk') !== -1) return 96.0;
        if (cat === 'dairy' || cat === 'fat') return 99.8;
        return 12.0;
      }
      var rawMilk = 0, totalPadatan = 0, water = 0, premix = 0, others = [];
      var tsTotalPadatanPct = 0;
      var dairySolidItems = [];
      Object.keys(composition).forEach(function(rmid) {
        var pct = safeNumLocal(composition[rmid]);
        if (pct <= 0) return;
        var rm = rmMap[rmid] || rmMap[String(rmid).trim().toUpperCase()];
        if (!rm) { others.push({ name: rmid, pct: pct }); return; }
        var cat = String(rm.category || '').trim().toLowerCase();
        if (isWaterRM(rm)) water += pct;
        else if (isRawMilkRM(rm)) rawMilk += pct;
        else if (isDairySolidRM(rm)) {
          var tsBahan = getRMBahanTS(rm);
          var tsContribution = pct * (tsBahan / 100);
          totalPadatan += pct;
          tsTotalPadatanPct += tsContribution;
          dairySolidItems.push({ rmid: rm.rmid, name: rm.name, pct: pct, tsBahan: tsBahan, tsContribution: tsContribution });
        } else if (cat === 'premix') premix += pct;
        else others.push({ name: rm.name, pct: pct });
      });
      var pctRekombinasiMurni = tsTotalPadatanPct / 0.12;
      var airTerserap = Math.max(0, pctRekombinasiMurni - totalPadatan);
      var sisaAir = Math.max(0, water - airTerserap);
      var fmt = function(n) { return (Math.round(n * 10) / 10).toFixed(1); };
      var fmt2 = function(n) { return (Math.round(n * 100) / 100).toFixed(2); };
      var bold = function(s) { return '<strong>' + s + '</strong>'; };
      var allergen = '.<br><em class="text-red-600 font-medium">Mengandung alergen: susu sapi.</em>';
      function sortDesc(arr) { return arr.sort(function(a, b) { return b.pct - a.pct; }); }
      var parts = [];
      if (rawMilk > 0) parts.push('Segar');
      if (totalPadatan > 0) parts.push('Bubuk, Lemak Susu');
      var teksGabung = 'Susu (' + parts.join(', ') + ')';
      var dairySubNames = dairySolidItems.map(function(d) { return escapeHtml(d.name); }).join(', ');
      var teksRekombinasi = dairySolidItems.length > 0
        ? 'Susu Rekombinasi (Air, Padatan Susu (' + dairySubNames + '))'
        : 'Susu Rekombinasi (Air, Padatan Susu)';
      var o1 = [];
      if (water > 0) o1.push({ text: 'Air', pct: water });
      if (rawMilk > 0) o1.push({ text: bold('Susu Segar') + ' (' + fmt(rawMilk) + '%)', pct: rawMilk });
      if (totalPadatan > 0) o1.push({ text: bold('Padatan Susu') + ' (' + fmt(totalPadatan) + '%)', pct: totalPadatan });
      others.forEach(function(o) { o1.push({ text: escapeHtml(o.name) + ' (' + fmt(o.pct) + '%)', pct: o.pct }); });
      if (premix > 0) o1.push({ text: 'Premix Vitamin & Mineral', pct: premix });
      sortDesc(o1);
      var opt1 = o1.map(function(i) { return i.text; }).join(', ') + allergen;
      var o2 = [];
      if (rawMilk > 0) o2.push({ text: bold('Susu Segar') + ' (' + fmt(rawMilk) + '%)', pct: rawMilk });
      if (pctRekombinasiMurni > 0) o2.push({ text: bold(teksRekombinasi) + ' (' + fmt(pctRekombinasiMurni) + '%)', pct: pctRekombinasiMurni });
      if (sisaAir > 0.1) o2.push({ text: 'Air', pct: sisaAir });
      others.forEach(function(o) { o2.push({ text: escapeHtml(o.name) + ' (' + fmt(o.pct) + '%)', pct: o.pct }); });
      if (premix > 0) o2.push({ text: 'Premix Vitamin & Mineral', pct: premix });
      sortDesc(o2);
      var opt2_text = o2.map(function(i) { return i.text; }).join(', ') + allergen;
      var calcHtml = '';
      if (totalPadatan > 0) {
        var tsBahanAvg = (tsTotalPadatanPct / totalPadatan) * 100;
        var dairyRowsHtml = dairySolidItems.map(function(d) {
          return '<tr class="border-b border-yellow-200/60">' +
            '<td class="py-1 px-1.5 font-medium text-gray-800">' + escapeHtml(d.name) + ' <span class="text-[10px] text-gray-500 font-mono">(' + escapeHtml(d.rmid) + ')</span></td>' +
            '<td class="py-1 px-1.5 text-center font-mono">' + fmt2(d.pct) + '%</td>' +
            '<td class="py-1 px-1.5 text-center font-mono">' + fmt2(d.tsBahan) + '%</td>' +
            '<td class="py-1 px-1.5 text-right font-mono font-semibold text-blue-900">' + fmt2(d.tsContribution) + '%</td>' +
            '</tr>';
        }).join('');
        calcHtml = '<div class="mt-3 p-3 bg-yellow-50 border border-yellow-200 rounded text-xs">' +
          '<div class="font-bold text-gray-800 mb-1.5 flex items-center justify-between">' +
          '<span>📝 Rincian Bahan &amp; Perhitungan Susu Rekombinasi (Standar Susu Cair 12% TS):</span>' +
          '<span class="text-[11px] font-semibold text-blue-800 bg-yellow-200/60 px-1.5 py-0.5 rounded">' + dairySolidItems.length + ' RM Padatan Susu Terlibat</span>' +
          '</div>' +
          '<table class="w-full text-xs mb-2 border border-yellow-200 bg-white rounded overflow-hidden">' +
          '<thead><tr class="bg-yellow-100 text-gray-700">' +
          '<th class="py-1 px-1.5 text-left">Bahan Baku (Padatan Susu)</th>' +
          '<th class="py-1 px-1.5 text-center">% Resep</th>' +
          '<th class="py-1 px-1.5 text-center">% TS Bahan</th>' +
          '<th class="py-1 px-1.5 text-right">Kontribusi TS (%)</th>' +
          '</tr></thead><tbody>' + dairyRowsHtml + '</tbody>' +
          '<tfoot><tr class="font-bold bg-yellow-100/70 border-t border-yellow-300">' +
          '<td class="py-1 px-1.5">TOTAL PADATAN SUSU</td>' +
          '<td class="py-1 px-1.5 text-center text-blue-900">' + fmt2(totalPadatan) + '%</td>' +
          '<td class="py-1 px-1.5 text-center text-gray-600">Rata² ' + fmt2(tsBahanAvg) + '%</td>' +
          '<td class="py-1 px-1.5 text-right text-blue-900 font-bold">' + fmt2(tsTotalPadatanPct) + '%</td>' +
          '</tr></tfoot></table>' +
          '<div class="space-y-1 font-mono text-[11px] text-gray-800 bg-white/70 p-2 rounded border border-yellow-200/60">' +
          '<div>1. <b>Total Padatan Susu (TS Murni)</b> = <b>' + fmt2(tsTotalPadatanPct) + '%</b> (dihasilkan dari ' + dairySolidItems.length + ' bahan dairy di atas)</div>' +
          '<div>2. <b>Konversi Setara Susu Cair Standar (TS 12%)</b> = ' + fmt2(tsTotalPadatanPct) + '% ÷ 0.12 = <b>' + fmt2(pctRekombinasiMurni) + '%</b></div>' +
          '<div>3. <b>Air Diserap untuk Rekombinasi</b> = ' + fmt2(pctRekombinasiMurni) + '% - ' + fmt2(totalPadatan) + '% = <b>' + fmt2(airTerserap) + '%</b></div>' +
          '<div>4. <b>Sisa Air Bebas (Label Air)</b> = Total Air (' + fmt2(water) + '%) - Air Diserap (' + fmt2(airTerserap) + '%) = <b>' + fmt2(sisaAir) + '%</b></div>' +
          '</div></div>';
      }
      var opt2 = opt2_text + calcHtml;
      var totalSusuGabungan = rawMilk + totalPadatan;
      var o3 = [];
      if (totalSusuGabungan > 0) o3.push({ text: bold(teksGabung) + ' (' + fmt(totalSusuGabungan) + '%)', pct: totalSusuGabungan });
      if (water > 0) o3.push({ text: 'Air', pct: water });
      others.forEach(function(o) { o3.push({ text: escapeHtml(o.name) + ' (' + fmt(o.pct) + '%)', pct: o.pct }); });
      if (premix > 0) o3.push({ text: 'Premix Vitamin & Mineral', pct: premix });
      sortDesc(o3);
      var opt3 = o3.map(function(i) { return i.text; }).join(', ') + allergen;
      var o4 = [];
      if (rawMilk > 0) o4.push({ text: bold('Susu Segar') + ' (' + fmt(rawMilk) + '%)', pct: rawMilk });
      if (totalPadatan > 0) o4.push({ text: bold('Padatan Susu Sapi') + ' (' + fmt(totalPadatan) + '%)', pct: totalPadatan });
      if (water > 0) o4.push({ text: 'Air', pct: water });
      others.forEach(function(o) { o4.push({ text: escapeHtml(o.name) + ' (' + fmt(o.pct) + '%)', pct: o.pct }); });
      if (premix > 0) o4.push({ text: 'Premix Vitamin & Mineral', pct: premix });
      sortDesc(o4);
      var opt4 = o4.map(function(i) { return i.text; }).join(', ') + allergen;
      return [
        { id: 'opt1', title: '1. Standar (QUID)', text: opt1 },
        { id: 'opt2', title: '2. Rekombinasi (Indomilk)', text: opt2 },
        { id: 'opt3', title: '3. Gabung Susu (FF)', text: opt3 },
        { id: 'opt4', title: '4. Padatan Susu (Dancow)', text: opt4 }
      ];
    }

    // ============================================================
    // INIT
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
      bindEvents();
      showLoadingOverlay();
      loadInitialData();
    });
  </script>
