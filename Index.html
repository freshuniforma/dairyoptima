  <script>
    // ============================================================
    // STATE
    // ============================================================
    const APP = {
      ready: false,
      loading: false,
      data: null,
      lastOptimizerResult: null,
      sortedSolutions: [],
      comparatorFilter: [],
      comparatorSubTab: 'recipe',
      showHpp: false,
      showRMName: false,
      tempBankList: [],
      runHistory: [],
      activeTab: 'home',
      selectedProductId: null,
      selectedRMIDs: [],
      nSolutions: 50,
      fatBasis: 'fatTotal',
      waterParams: null,
      lastError: null
    };

    // Definisi 7 parameter air (label + batas + satuan) — konsisten dgn WATER_LIMITS di code.gs
    const WATER_FIELDS = [
      { key: 'waterHardness',   label: 'Hardness',   unit: 'mg/L CaCO₃', limit: 100, op: '>'  },
      { key: 'waterTds',        label: 'TDS',        unit: 'mg/L',       limit: 500, op: '>'  },
      { key: 'waterCa',         label: 'Ca²⁺',       unit: 'mg/L',       limit: 40,  op: '>'  },
      { key: 'waterMg',         label: 'Mg²⁺',       unit: 'mg/L',       limit: 30,  op: '>'  },
      { key: 'waterPh',         label: 'pH',         unit: '',           limit: null, op: 'ph' },
      { key: 'waterIron',       label: 'Besi (Fe)',  unit: 'mg/L',       limit: 0.3, op: '>'  },
      { key: 'waterAlkalinity', label: 'Alkalinitas',unit: 'mg/L CaCO₃', limit: 50,  op: '>'  }
    ];
    const WATER_PH_MIN = 6.0;
    const WATER_PH_MAX = 8.5;

    const DEFAULT_WATER_PARAMS = {
      waterHardness: 100, waterTds: 500, waterCa: 40, waterMg: 30,
      waterPh: 6.7, waterIron: 0.3, waterAlkalinity: 50
    };

    // Helper untuk membuat Searchable Dropdown
    // options = [{ value: 'RM001', label: 'RM001 — Raw Milk' }]
    window.createSearchableDropdown = function(containerId, options, initialValue, onChangeCallback) {
      const container = document.getElementById(containerId);
      if (!container) return;
      
      // Urutkan berdasarkan label (Nama)
      options.sort((a, b) => a.label.localeCompare(b.label));
      
      const initialOpt = options.find(o => o.value === initialValue);
      const initialText = initialOpt ? initialOpt.label : '';

      container.innerHTML = `
        <div class="search-dropdown-wrapper">
          <input type="text" class="search-dropdown-input" placeholder="Ketik untuk mencari..." value="${escapeHtml(initialText)}" autocomplete="off">
          <div class="search-dropdown-list"></div>
        </div>
      `;

      const input = container.querySelector('.search-dropdown-input');
      const list = container.querySelector('.search-dropdown-list');

      const renderList = (filterText) => {
        const term = filterText.toLowerCase();
        const filtered = options.filter(o => o.label.toLowerCase().includes(term));
        
        if (filtered.length === 0) {
          list.innerHTML = '<div class="search-dropdown-empty">Tidak ditemukan</div>';
          return;
        }
        
        list.innerHTML = filtered.map(o => 
          `<div class="search-dropdown-item" data-val="${o.value}" data-lbl="${escapeHtml(o.label)}">${escapeHtml(o.label)}</div>`
        ).join('');
        
        // Bind click
        list.querySelectorAll('.search-dropdown-item').forEach(el => {
          el.addEventListener('click', () => {
            input.value = el.dataset.lbl;
            list.style.display = 'none';
            if (onChangeCallback) onChangeCallback(el.dataset.val);
          });
        });
      };

      input.addEventListener('focus', () => {
        renderList(input.value === (initialOpt?initialOpt.label:'') ? '' : input.value);
        list.style.display = 'block';
      });

      input.addEventListener('input', (e) => {
        renderList(e.target.value);
        list.style.display = 'block';
        // Beri tahu parent bahwa user sedang mengetik (value mungkin belum valid)
        if (onChangeCallback) onChangeCallback('', e.target.value); 
      });

      // Sembunyikan saat klik di luar
      document.addEventListener('click', (e) => {
        if (!container.contains(e.target)) {
          list.style.display = 'none';
          // Jika value tidak cocok dengan opsi manapun, kembalikan ke value valid terakhir (opsional)
        }
      });
    };
    // ============================================================
    // API WRAPPER
    // ============================================================
    function callApi(fnName, args, timeoutMs) {
      timeoutMs = timeoutMs || 60000;
      return new Promise((resolve, reject) => {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          reject(new Error('google.script.run tidak tersedia. Pastikan Web App di-deploy dengan benar.'));
          return;
        }
        let settled = false;
        const timer = setTimeout(() => {
          if (!settled) {
            settled = true;
            reject(new Error('Timeout: ' + fnName + ' tidak merespons dalam ' + (timeoutMs/1000) + ' detik'));
          }
        }, timeoutMs);
        const runner = google.script.run
          .withSuccessHandler(res => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            resolve(res);
          })
          .withFailureHandler(err => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            reject(err instanceof Error ? err : new Error(String(err)));
          });
        try {
          if (typeof runner[fnName] !== 'function') {
            settled = true;
            clearTimeout(timer);
            reject(new Error('Fungsi backend "' + fnName + '" tidak ditemukan. Pastikan deployment Web App versi terbaru.'));
            return;
          }
          runner[fnName].apply(runner, args || []);
        } catch (e) {
          if (!settled) {
            settled = true;
            clearTimeout(timer);
            reject(e);
          }
        }
      });
    }

    // ============================================================
    // FORMATTING
    // ============================================================
    function fmtRp(n) {
      if (n === null || n === undefined || isNaN(n)) return '-';
      return 'Rp ' + Math.round(n).toLocaleString('id-ID');
    }
    function fmtNum(n, d) {
      if (n === null || n === undefined || isNaN(n)) return '-';
      const dd = d === undefined ? 2 : d;
      return Number(n).toLocaleString('id-ID', { minimumFractionDigits: dd, maximumFractionDigits: dd });
    }
    function fmtInt(n) {
      if (n === null || n === undefined || isNaN(n)) return '-';
      return Math.round(n).toLocaleString('id-ID');
    }
    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function safeNumLocal(v) {
      if (v === '' || v === null || v === undefined) return 0;
      const n = Number(v);
      return isNaN(n) ? 0 : n;
    }

    // ============================================================
    // TOAST & STATUS
    // ============================================================
    function showToast(msg, type) {
      const c = document.getElementById('toastContainer');
      if (!c) return;
      const colors = { success: 'bg-green-600', error: 'bg-red-600', info: 'bg-blue-600', warn: 'bg-yellow-600' };
      const el = document.createElement('div');
      el.className = (colors[type] || colors.info) + ' text-white px-4 py-2 rounded shadow text-sm max-w-xs';
      el.textContent = msg;
      c.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
    function setStatus(text, cls) {
      const el = document.getElementById('appStatus');
      if (!el) return;
      el.textContent = text;
      el.className = 'text-xs px-2 py-1 rounded ' + (cls || 'bg-blue-800 text-blue-100');
    }

    // ============================================================
    // BADGE
    // ============================================================
    function gradeBadge(grade) {
      if (!grade) return '<span class="badge badge-infeasible">-</span>';
      return '<span class="badge badge-' + grade + '">' + grade + '</span>';
    }
    function severityBadge(sev) {
      if (!sev) return '';
      return '<span class="badge badge-' + sev + '">' + sev + '</span>';
    }
    function statusBadge(status) {
      if (!status) return '';
      const cls = status.replace(/[^A-Za-z0-9_]/g, '') || 'infeasible';
      return '<span class="badge badge-' + cls + '">' + escapeHtml(status) + '</span>';
    }
    const RM_PALETTE = [
      'bg-blue-100 text-blue-800', 'bg-green-100 text-green-800', 'bg-yellow-100 text-yellow-800',
      'bg-purple-100 text-purple-800', 'bg-pink-100 text-pink-800', 'bg-indigo-100 text-indigo-800',
      'bg-red-100 text-red-800', 'bg-teal-100 text-teal-800', 'bg-orange-100 text-orange-800',
      'bg-cyan-100 text-cyan-800', 'bg-lime-100 text-lime-800', 'bg-fuchsia-100 text-fuchsia-800',
      'bg-rose-100 text-rose-800', 'bg-sky-100 text-sky-800'
    ];
    function rmColorClass(rmid) {
      if (!rmid) return 'bg-gray-100 text-gray-800';
      let hash = 0;
      for (let i = 0; i < rmid.length; i++) hash = rmid.charCodeAt(i) + ((hash << 5) - hash);
      return RM_PALETTE[Math.abs(hash) % RM_PALETTE.length];
    }

    // ============================================================
    // FIND HELPERS
    // ============================================================
    function findRM(rmid) {
      if (!APP.data) return null;
      return APP.data.rawMaterials.find(r => r.rmid === rmid) || null;
    }
    function findProduct(pid) {
      if (!APP.data) return null;
      return APP.data.products.find(p => p.productId === pid) || null;
    }

    // ============================================================
    // WATER PARAMS HELPERS
    // ============================================================
    function getDefaultWaterParams() {
      if (APP.data && APP.data.waterParams) {
        const wp = APP.data.waterParams;
        const out = {};
        WATER_FIELDS.forEach(f => { out[f.key] = safeNumLocal(wp[f.key]); });
        return out;
      }
      return Object.assign({}, DEFAULT_WATER_PARAMS);
    }

    function waterFieldStatus(field, value) {
      const v = safeNumLocal(value);
      if (field.op === 'ph') {
        if (v < WATER_PH_MIN || v > WATER_PH_MAX) return { status: 'HIGH', cls: 'badge-High', text: 'KRITIS' };
        if (v < 6.5 || v > 8.0) return { status: 'WATCH', cls: 'badge-WATCH', text: 'WASPADA' };
        return { status: 'OK', cls: 'badge-OK', text: 'OK' };
      }
      if (v > field.limit) return { status: 'HIGH', cls: 'badge-High', text: '>' + field.limit };
      if (v > field.limit * 0.7) return { status: 'WATCH', cls: 'badge-WATCH', text: 'WASPADA' };
      return { status: 'OK', cls: 'badge-OK', text: 'OK' };
    }

    function bindWaterPanelEvents(waterParams, onChange) {
      document.querySelectorAll('[data-water-field]').forEach(inp => {
        inp.addEventListener('input', e => {
          const key = e.target.dataset.waterField;
          const val = safeNumLocal(e.target.value);
          waterParams[key] = val;
          const field = WATER_FIELDS.find(f => f.key === key);
          if (!field) return;
          const st = waterFieldStatus(field, val);
          const wrap = e.target.closest('.water-input-item');
          const badge = e.target.parentElement.querySelector('[data-water-status]');
          if (wrap) wrap.classList.toggle('exceeded', st.status === 'HIGH');
          if (badge) { badge.className = 'water-status-badge ' + st.cls; badge.textContent = st.text; }
          if (onChange) onChange(waterParams);
        });
      });
      const btnReset = document.getElementById('btnResetWater');
      if (btnReset) {
        btnReset.addEventListener('click', () => {
          const def = getDefaultWaterParams();
          Object.keys(def).forEach(k => { waterParams[k] = def[k]; });
          WATER_FIELDS.forEach(f => {
            const inp = document.querySelector('[data-water-field="' + f.key + '"]');
            if (inp) inp.value = waterParams[f.key];
            const st = waterFieldStatus(f, waterParams[f.key]);
            const wrap = inp ? inp.closest('.water-input-item') : null;
            const badge = inp ? inp.parentElement.querySelector('[data-water-status]') : null;
            if (wrap) wrap.classList.toggle('exceeded', st.status === 'HIGH');
            if (badge) { badge.className = 'water-status-badge ' + st.cls; badge.textContent = st.text; }
          });
          if (onChange) onChange(waterParams);
        });
      }
    }

    // ============================================================
    // LOAD DATA
    // ============================================================
    async function loadInitialData(forceRefresh) {
      APP.loading = true;
      showLoadingOverlay();
      updateLoadingOverlay(10, 'Menghubungkan ke server…');

      try {
        const data = await callApi('getAppInitialData', [!!forceRefresh]);
        updateLoadingOverlay(50, 'Memuat master data…');
        APP.data = data;
        APP.ready = true;
        if (!APP.waterParams) {
          APP.waterParams = getDefaultWaterParams();
        }
        setStatus('Siap', 'bg-green-700 text-white');

        // Pre-load daftar resep di background (untuk tampilan count di Home)
        updateLoadingOverlay(75, 'Memuat daftar resep…');
        try {
          var recipesRes = await callApi('api_listRecipes', [{}], 15000);
          if (recipesRes && recipesRes.ok) {
            RECIPE_APP.list = recipesRes.recipes || [];
          }
        } catch (e) {
          console.warn('[loadInitialData] pre-load recipes gagal:', e);
        }

        updateLoadingOverlay(95, 'Menyiapkan tampilan…');
        renderActiveTab();
        updateLoadingOverlay(100, 'Selesai');
        setTimeout(hideLoadingOverlay, 300);
      } catch (e) {
        APP.lastError = e.message || String(e);
        console.error('[loadInitialData] Gagal:', e);
        hideLoadingOverlay();
        setStatus('Gagal memuat', 'bg-red-700 text-white');
        document.getElementById('mainContent').innerHTML =
          '<div class="card p-6 border-red-300"><h2 class="text-xl font-bold text-red-700 mb-2">Gagal memuat data</h2>' +
          '<p class="text-sm text-gray-700">' + escapeHtml(APP.lastError) + '</p>' +
          '<button onclick="loadInitialData()" class="mt-3 bg-blue-600 text-white px-3 py-1.5 rounded text-sm">Coba lagi</button></div>';
      } finally {
        APP.loading = false;
      }
    }

    function renderTempBank(newResults) {
      const container = document.getElementById('bankTableContainer');
      if (!container) return;
      if (!newResults || newResults.length === 0) return;

      if (APP.tempBankList.length === 0) {
        APP.tempBankList = newResults.slice();
      } else {
        const existingKeys = new Set(APP.tempBankList.map(s =>
          Object.keys(s.composition).sort().map(k => k + ':' + s.composition[k]).join(',')
        ));
        newResults.forEach(s => {
          const sig = Object.keys(s.composition).sort().map(k => k + ':' + s.composition[k]).join(',');
          if (!existingKeys.has(sig)) {
            APP.tempBankList.push(s);
            existingKeys.add(sig);
          }
        });
      }
      APP.tempBankList.sort((a, b) => a.costPerKg - b.costPerKg);
      const displayList = APP.tempBankList.slice().reverse();

      const countEl = document.getElementById('bankCount');
      if (countEl) countEl.textContent = APP.tempBankList.length;

      const rows = displayList.map((s, i) => {
        const comp = s.composition || {};
        const sortedRMs = Object.keys(comp).sort((a, b) => comp[b] - comp[a]);
        const compShort = sortedRMs.map(k => {
          const cls = rmColorClass(k);
          return '<span class="inline-block px-1 rounded ' + cls + ' font-bold text-[10px] mr-1">' +
                 escapeHtml(k) + '</span> <span class="text-xs">' + fmtNum(comp[k], 1) + '%</span>';
        }).join(' ');
        return '<tr class="border-b hover:bg-gray-50">' +
          '<td class="px-2 py-1 text-xs text-center">' + (i + 1) + '</td>' +
          '<td class="px-2 py-1 text-xs text-gray-700">' + compShort + '</td></tr>';
      }).join('');

      container.innerHTML = '<table class="w-full text-sm"><thead><tr class="bg-gray-100 sticky top-0">' +
        '<th class="text-center px-2 py-1 text-xs w-8">#</th>' +
        '<th class="text-left px-2 py-1 text-xs">Komposisi</th>' +
        '</tr></thead><tbody>' + rows + '</tbody></table>';
    }

    async function runOptimizerFromTab() {
      if (!APP.selectedProductId) { showToast('Pilih produk dulu', 'warn'); return; }
      if (!APP.selectedRMIDs || APP.selectedRMIDs.length === 0) { showToast('Pilih minimal 1 RM', 'warn'); return; }

      const product = findProduct(APP.selectedProductId);
      const productLabel = product ? product.product : APP.selectedProductId;

      showProgressModal(productLabel);
      updateProgress(5, 'Memulai job…', [], 'Menyiapkan job…');

      let jobId = null;
      let cancelled = false;
      let currentPct = 5;
      const startTime = Date.now();

      const btnCancel = document.getElementById('btnCancelJob');
      if (btnCancel) {
        const newBtn = btnCancel.cloneNode(true);
        btnCancel.parentNode.replaceChild(newBtn, btnCancel);
        newBtn.addEventListener('click', async () => {
          cancelled = true;
          if (jobId) { try { await callApi('cancelOptimizationJob', [jobId]); } catch (e) {} }
          closeProgressModal();
          showToast('Optimasi dibatalkan', 'warn');
        });
      }

      try {
        const startRes = await callApi('startOptimizationJob', [{
          productId: String(APP.selectedProductId),
          selectedRMIDs: APP.selectedRMIDs.map(String),
          nSolutions: APP.nSolutions || 50,
          fatBasis: APP.fatBasis || 'fatTotal',
          waterParams: APP.waterParams || getDefaultWaterParams()
        }], 30000);

        if (!startRes || !startRes.ok) throw new Error((startRes && startRes.error) || 'Gagal memulai job');
        jobId = startRes.jobId;
        updateProgress(10, 'Memproses kombinasi…', [], 'Job dimulai...');

        let attempts = 0;
        const maxAttempts = 240;
        let finalResult = null;

        while (!cancelled && attempts < maxAttempts) {
          await new Promise(res => setTimeout(res, 500));
          attempts++;
          let stepRes;
          try {
            stepRes = await callApi('stepOptimizationJob', [jobId], 300000);
          } catch (err) {
            continue;
          }
          if (!stepRes || !stepRes.ok) throw new Error((stepRes && stepRes.error) || 'Step gagal');

          if (currentPct < 95 && stepRes.status === 'running') currentPct += 2;
          else if (stepRes.progressPct) currentPct = Math.max(currentPct, stepRes.progressPct);

          const elapsedSec = Math.round((Date.now() - startTime) / 1000);
          const elM = Math.floor(elapsedSec / 60);
          const elS = elapsedSec % 60;
          const elapsedStr = (elM > 0 ? elM + 'm ' : '') + elS + 's';

          updateProgress(
            currentPct,
            stepRes.stepLabel || 'Memproses…',
            stepRes.log || [],
            '[Elapsed: ' + elapsedStr + '] ' + (stepRes.stepLabel || '')
          );

          if (stepRes.tempResults && stepRes.tempResults.length > 0) {
            renderTempBank(stepRes.tempResults);
          }

          if (stepRes.status === 'done') { finalResult = stepRes.result; break; }
        }

        if (cancelled) return;
        if (!finalResult) throw new Error('Timeout: backend tidak selesai. Coba kurangi jumlah solusi.');

        updateProgress(100, 'Selesai!', [], 'Selesai');
        await new Promise(res => setTimeout(res, 500));
        closeProgressModal();

        APP.lastOptimizerResult = {
          ok: true, runId: jobId, productId: String(APP.selectedProductId),
          feasible: finalResult.feasible,
          bankSize: finalResult.bankSize,
          reason: finalResult.reason,
          results: finalResult.results || [],
          selectedRMIDs: APP.selectedRMIDs.slice(),
          waterParams: Object.assign({}, APP.waterParams),
          elapsedMs: Date.now() - startTime
        };

        renderOptimizerResults();
        showToast(finalResult.feasible ? 'Optimasi selesai' : 'Tidak ada solusi', finalResult.feasible ? 'success' : 'warn');

      } catch (e) {
        if (!cancelled) {
          const logEl = document.getElementById('progressLog');
          if (logEl) {
            logEl.innerHTML += '<div class="text-red-600 font-bold mt-2 p-2 bg-red-100 border border-red-300 rounded">❌ Error: ' + escapeHtml(e.message) + '</div>';
            logEl.scrollTop = logEl.scrollHeight;
          }
          updateProgress(0, 'Gagal', [], 'Error: ' + e.message);
          showToast('Optimasi Gagal', 'error');
        }
      }
    }

        // ============================================================
    // RISK RADAR CHART (Engine 1)
    // ============================================================
    function normalizeRiskForRadar(check) {
      const v = check.value;
      if (v === null || v === undefined) return 0;
      const target = String(check.target || '');
      const nums = target.match(/-?\d+(?:\.\d+)?/g);
      if (!nums || nums.length === 0) return 0;
      const limits = nums.map(Number);
      const val = Number(v);
      if (isNaN(val)) return 0;

      // Status langsung HIGH → full 100 (kecuali bisa dihitung lebih rendah)
      if (check.status === 'N/A') return 0;

      if (target.indexOf('≤') >= 0) {
        const lim = limits[0];
        if (lim <= 0) return 0;
        return Math.min(100, Math.max(0, (val / lim) * 100));
      }
      if (target.indexOf('–') >= 0 || target.indexOf('-') >= 0) {
        const lo = limits[0];
        const hi = limits[1] !== undefined ? limits[1] : limits[0];
        if (val >= lo && val <= hi) return 0;
        if (val < lo) return Math.min(100, ((lo - val) / Math.max(lo, 0.01)) * 100);
        return Math.min(100, ((val - hi) / Math.max(hi, 0.01)) * 100);
      }
      return 0;
    }

    function abbreviateRiskLabel(label) {
      const map = {
        'Rasio Protein : Fat': 'P:F',
        'Rasio Ca : P': 'Ca:P',
        'Total Solid': 'TS',
        'pH Produk': 'pH Prod',
        'Kesadahan Air (Air)': 'Hardness',
        'TDS Air (Air)': 'TDS',
        'Kalsium Air (Ca²⁺) (Air)': 'Ca Air',
        'Magnesium Air (Mg²⁺) (Air)': 'Mg Air',
        'Besi Air (Fe) (Air)': 'Fe Air',
        'Alkalinitas Air (Air)': 'Alkal.',
        'pH Air': 'pH Air'
      };
      if (map[label]) return map[label];
      // strip suffix (Air) dan truncate
      let s = String(label).replace(/\s*\(Air\)\s*$/i, '').trim();
      if (s.length > 10) s = s.substring(0, 9) + '…';
      return s;
    }

    function renderRiskRadarSVG(checks, benchmarkChecks) {
      checks = checks || [];
      if (checks.length === 0) {
        return '<div class="text-sm text-gray-500 p-3">Tidak ada data untuk radar chart.</div>';
      }

      const W = 380, H = 380, CX = W / 2, CY = H / 2, R = 130;
      const n = checks.length;
      const angleStep = (2 * Math.PI) / n;

      function pointAt(idx, radiusFraction) {
        const angle = -Math.PI / 2 + idx * angleStep;
        const r = R * radiusFraction;
        return {
          x: CX + r * Math.cos(angle),
          y: CY + r * Math.sin(angle)
        };
      }

      // Rings background (25%, 50%, 75%, 100%)
      let ringsHtml = '';
      [0.25, 0.5, 0.75, 1.0].forEach(frac => {
        let pts = [];
        for (let i = 0; i < n; i++) {
          const p = pointAt(i, frac);
          pts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
        }
        ringsHtml += '<polygon points="' + pts.join(' ') + '" fill="none" stroke="#e5e7eb" stroke-width="' + (frac === 1 ? '1.5' : '0.8') + '" ' + (frac === 1 ? '' : 'stroke-dasharray="2 2"') + '/>';
      });

      // Axis lines + labels
      let axisHtml = '';
      let labelsHtml = '';
      checks.forEach((c, i) => {
        const p = pointAt(i, 1.0);
        axisHtml += '<line x1="' + CX + '" y1="' + CY + '" x2="' + p.x.toFixed(1) + '" y2="' + p.y.toFixed(1) + '" class="radar-axis-line"/>';

        // Label position: sedikit lebih keluar dari R
        const labelP = pointAt(i, 1.15);
        const abbr = abbreviateRiskLabel(c.label);
        const anchor = labelP.x < CX - 5 ? 'end' : (labelP.x > CX + 5 ? 'start' : 'middle');

        // Warna label sesuai status
        const labelColor = c.status === 'HIGH' ? '#dc2626' : (c.status === 'WATCH' ? '#d97706' : '#059669');

        labelsHtml += '<text x="' + labelP.x.toFixed(1) + '" y="' + (labelP.y - 2).toFixed(1) + '" class="radar-axis-label" text-anchor="' + anchor + '" fill="' + labelColor + '">' + escapeHtml(abbr) + '</text>';
        labelsHtml += '<text x="' + labelP.x.toFixed(1) + '" y="' + (labelP.y + 9).toFixed(1) + '" class="radar-axis-value" text-anchor="' + anchor + '">' +
          (c.value !== null && c.value !== undefined ? fmtNum(c.value, 1) : '-') + '</text>';
      });

      // Current polygon
      let currentPts = [];
      checks.forEach((c, i) => {
        const val = normalizeRiskForRadar(c);
        const frac = Math.max(0.02, val / 100);
        const p = pointAt(i, frac);
        currentPts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
      });
      const currentPolygon = '<polygon points="' + currentPts.join(' ') + '" class="radar-polygon-current"/>';

      // Dots di titik current
      let dotsHtml = '';
      checks.forEach((c, i) => {
        const val = normalizeRiskForRadar(c);
        const frac = Math.max(0.02, val / 100);
        const p = pointAt(i, frac);
        const dotColor = c.status === 'HIGH' ? '#dc2626' : (c.status === 'WATCH' ? '#d97706' : '#059669');
        dotsHtml += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="4" fill="' + dotColor + '" stroke="#fff" stroke-width="1.5"><title>' + escapeHtml(c.label) + ': ' + (c.value !== null ? fmtNum(c.value, 2) : '-') + ' (' + escapeHtml(c.status || '-') + ')</title></circle>';
      });

      // Benchmark polygon (kalau ada)
      let benchmarkPolygon = '';
      if (benchmarkChecks && benchmarkChecks.length === checks.length) {
        let bPts = [];
        benchmarkChecks.forEach((c, i) => {
          const val = normalizeRiskForRadar(c);
          const frac = Math.max(0.02, val / 100);
          const p = pointAt(i, frac);
          bPts.push(p.x.toFixed(1) + ',' + p.y.toFixed(1));
        });
        benchmarkPolygon = '<polygon points="' + bPts.join(' ') + '" class="radar-polygon-benchmark"/>';
      }

      return (
        '<div class="radar-container">' +
        '<div class="flex justify-between items-center mb-1">' +
        '<div class="font-bold text-sm text-blue-900">📊 Radar Risiko Engine 1</div>' +
        '<div class="text-[10px] text-gray-500">Skala 0–100 (luar = lebih risiko)</div>' +
        '</div>' +
        '<svg class="radar-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">' +
        ringsHtml +
        axisHtml +
        benchmarkPolygon +
        currentPolygon +
        dotsHtml +
        labelsHtml +
        '</svg>' +
        '<div class="flex flex-wrap gap-2 mt-2 justify-center text-[10px] text-gray-600">' +
        '<span><span class="radar-dot-legend" style="background:#3b82f6"></span>Solusi ini</span>' +
        (benchmarkChecks && benchmarkChecks.length ? '<span><span class="radar-dot-legend" style="background:#9ca3af"></span>Benchmark (rata-rata solusi)</span>' : '') +
        '<span><span class="radar-dot-legend" style="background:#059669"></span>OK</span>' +
        '<span><span class="radar-dot-legend" style="background:#d97706"></span>Waspada</span>' +
        '<span><span class="radar-dot-legend" style="background:#dc2626"></span>Kritis</span>' +
        '</div>' +
        '</div>'
      );
    }

    // ============================================================
    // RISK MATRIX HEATMAP (Engine 2)
    // ============================================================
    function renderRiskMatrixHeatmap(diagnoses) {
      diagnoses = diagnoses || [];

      // Klasifikasi sel berdasarkan (L, S): warna 1-5
      function cellClass(L, S) {
        const score = L * S;
        if (score >= 20) return 'heatmap-cell heatmap-cell-5';
        if (score >= 12) return 'heatmap-cell heatmap-cell-4';
        if (score >= 6) return 'heatmap-cell heatmap-cell-3';
        if (score >= 3) return 'heatmap-cell heatmap-cell-2';
        return 'heatmap-cell heatmap-cell-1';
      }

      // Kelompokkan diagnosis by cell (L, S)
      const byCell = {};
      diagnoses.forEach(d => {
        if (!d.triggered) return;
        const L = Math.round(d.likelihood || 0);
        const S = Math.round(d.severityScore || 0);
        if (L < 1 || L > 5 || S < 1 || S > 5) return;
        const key = L + '-' + S;
        if (!byCell[key]) byCell[key] = [];
        byCell[key].push(d);
      });

      // Build grid: baris = L (5..1), kolom = S (1..5)
      let rowsHtml = '';
      for (let L = 5; L >= 1; L--) {
        rowsHtml += '<div class="heatmap-axis-label">' + L + '</div>';
        for (let S = 1; S <= 5; S++) {
          const key = L + '-' + S;
          const items = byCell[key] || [];
          const cls = cellClass(L, S);
          let dotsHtml = '';
          if (items.length > 0) {
            dotsHtml = '<div class="flex flex-wrap gap-0.5 justify-center items-center w-full h-full p-0.5">';
            items.slice(0, 4).forEach(d => {
              const dotCls = d.riskScore >= 20 ? '' : (d.riskScore >= 12 ? 'medium' : 'low');
              dotsHtml += '<span class="heatmap-dot ' + dotCls + '" data-ruleid="' + escapeHtml(d.ruleId) + '" data-tooltip="' + escapeHtml(d.ruleId + ' — ' + d.issue + ' | L=' + L + ' S=' + S + ' Risk=' + d.riskScore + ' | ' + d.level) + '">' + escapeHtml(d.ruleId.replace('STB', '')) + '</span>';
            });
            if (items.length > 4) {
              dotsHtml += '<span class="heatmap-dot" title="+' + (items.length - 4) + ' lagi">+' + (items.length - 4) + '</span>';
            }
            dotsHtml += '</div>';
          }
          rowsHtml += '<div class="' + cls + '" data-l="' + L + '" data-s="' + S + '">' + dotsHtml + '</div>';
        }
      }

      // Column headers (Severity 1..5)
      let colHeaders = '<div></div>';
      for (let S = 1; S <= 5; S++) {
        colHeaders += '<div class="heatmap-axis-label">' + S + '</div>';
      }

      return (
        '<div class="heatmap-container">' +
        '<div class="flex justify-between items-center mb-2">' +
        '<div class="font-bold text-sm text-amber-900">🎯 Risk Matrix Engine 2 (Likelihood × Severity)</div>' +

    // ============================================================
    function renderRiskVisualizationCombo(engine1, engine2, benchmarkEngine1) {
      const checks = (engine1 && engine1.checks) || [];
      const diagnoses = (engine2 && engine2.diagnoses) || [];
      const benchChecks = (benchmarkEngine1 && benchmarkEngine1.checks) || null;

      const radarHtml = renderRiskRadarSVG(checks, benchChecks);
      const heatmapHtml = renderRiskMatrixHeatmap(diagnoses);

      return '<div class="risk-viz-grid">' + radarHtml + heatmapHtml + '</div>';
    }

    // Bind heatmap dot click → scroll ke tabel Engine 2 + highlight baris
    function bindHeatmapInteractions() {
      // Tooltip
      let tooltipEl = document.getElementById('heatmapTooltip');
      if (!tooltipEl) {
        tooltipEl = document.createElement('div');
        tooltipEl.id = 'heatmapTooltip';
        tooltipEl.className = 'heatmap-tooltip';
        tooltipEl.style.display = 'none';
        document.body.appendChild(tooltipEl);
      }

      document.querySelectorAll('.heatmap-dot[data-tooltip]').forEach(dot => {
        dot.addEventListener('mouseenter', (e) => {
          tooltipEl.textContent = e.target.dataset.tooltip;
          tooltipEl.style.display = 'block';
        });
        dot.addEventListener('mousemove', (e) => {
          tooltipEl.style.left = (e.pageX + 12) + 'px';
          tooltipEl.style.top = (e.pageY - 20) + 'px';
        });
        dot.addEventListener('mouseleave', () => {
          tooltipEl.style.display = 'none';
        });
        dot.addEventListener('click', () => {
          const ruleId = dot.dataset.ruleid;
          if (!ruleId) return;
          // Cari baris Engine 2 dengan data-ruleid yang cocok
          const rows = document.querySelectorAll('[data-engine2-ruleid]');
          let targetRow = null;
          rows.forEach(r => {
            if (r.dataset.engine2Ruleid === ruleId) targetRow = r;
          });
          if (targetRow) {
            targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
            targetRow.classList.add('heatmap-rule-highlight');
            setTimeout(() => targetRow.classList.remove('heatmap-rule-highlight'), 2500);
          }
        });
      });
    }

        const el = document.getElementById('fourEngineContainer');
        if (el) el.innerHTML = r.fourEngine
          ? renderFourEngineSummaryFallback(r.fourEngine)
          : '<div class="text-sm text-gray-500 p-2">4-Engine tidak tersedia.</div>';
      }
    }

    function renderPriceSpectrum(sortedSols) {
      if (!sortedSols || sortedSols.length === 0) return '';
      const groups = {};
      sortedSols.forEach(s => {
        const key = Object.keys(s.composition || {}).sort().join(' + ');
        if (!groups[key]) groups[key] = [];
        groups[key].push(s.costPerKg || 0);
      });
      const groupKeys = Object.keys(groups);
      if (groupKeys.length === 0) return '';
      let globalMin = Infinity, globalMax = -Infinity;
      groupKeys.forEach(k => {
        const min = Math.min(...groups[k]), max = Math.max(...groups[k]);
        if (min < globalMin) globalMin = min;
        if (max > globalMax) globalMax = max;
      });
      const range = globalMax - globalMin;
      const pad = range * 0.05 || 1000;
      const axisMin = globalMin - pad;
      const axisMax = globalMax + pad;
      const axisRange = axisMax - axisMin;
      const groupData = groupKeys.map(key => {
        const min = Math.min(...groups[key]), max = Math.max(...groups[key]);
        return {
          key: key, min: min, max: max,
          leftPct: ((min - axisMin) / axisRange) * 100,
          widthPct: Math.max(((max - min) / axisRange) * 100, 2),
          count: groups[key].length
        };
      }).sort((a, b) => a.min - b.min);
      const lanes = [];
      groupData.forEach(g => {
        let placed = false;
        for (let i = 0; i < lanes.length; i++) {
          const maxInLane = Math.max(...lanes[i].map(x => x.max));
          if (g.min >= maxInLane) { lanes[i].push(g); g.lane = i; placed = true; break; }
        }
        if (!placed) { g.lane = lanes.length; lanes.push([g]); }
      });
      const laneHeight = 32;
      const chartHeight = lanes.length * laneHeight + 30;
      const COLORS = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#14b8a6'];
      let blocksHtml = '';
      groupData.forEach((g, idx) => {
        const color = COLORS[idx % COLORS.length];
        const topPx = g.lane * laneHeight + 10;
        blocksHtml += `
          <div class="absolute rounded shadow cursor-pointer hover:opacity-90 transition-opacity border border-white"
               style="left: ${g.leftPct}%; width: ${g.widthPct}%; top: ${topPx}px; height: ${laneHeight - 8}px; background-color: ${color};"
               title="Kombinasi: ${escapeHtml(g.key)}&#10;HPP Min: ${fmtRp(g.min)}&#10;HPP Max: ${fmtRp(g.max)}&#10;Jumlah Opsi: ${g.count}"
               onclick="togglePriceSpectrumCluster('${escapeHtml(g.key).replace(/'/g, "\\'")}')">
            <div class="w-full h-full flex items-center justify-center text-[10px] font-bold text-white shadow-sm truncate px-1">
               ${g.count} Opsi
            </div>
          </div>
        `;
      });
      return `
        <div class="mb-6 p-4 bg-white border rounded shadow-sm">
          <h4 class="font-bold text-sm mb-3 text-gray-800">📊 Peta Sebaran Harga (Price Spectrum)</h4>
          <div class="relative w-full bg-gray-100 rounded border" style="height: ${chartHeight}px;">
            ${blocksHtml}
          </div>
          <div class="flex justify-between text-xs font-semibold text-gray-600 mt-2">
            <span>← Termurah (${fmtRp(axisMin)})</span>
            <span>Termahal (${fmtRp(axisMax)}) →</span>
          </div>
        </div>
      `;
    }

    window.togglePriceSpectrumCluster = function(clusterKey) {
      const res = APP.lastOptimizerResult;
      if (!res || !res.results) return;
      const sols = res.results.slice().sort((a, b) => (a.costPerKg || 0) - (b.costPerKg || 0));
      const newFilter = [];
      sols.forEach((s, idx) => {
        const key = Object.keys(s.composition || {}).sort().join(' + ');
        if (key === clusterKey) newFilter.push(idx);
      });
      APP.comparatorFilter = newFilter;
      renderComparatorTab(document.getElementById('mainContent'));
    };

    // ============================================================
    // TAB: KOMPARATOR
    // ============================================================
    function renderComparatorTab(c) {
      const res = APP.lastOptimizerResult;
      if (!res || !res.feasible || !res.results || res.results.length === 0) {

          '<button onclick="switchTab(\'optimizer\')" class="mt-3 bg-blue-600 text-white px-3 py-1.5 rounded text-sm">Ke Optimizer</button></div>';
        return;
      }
      const sols = res.results.slice().sort((a, b) => (a.costPerKg || 0) - (b.costPerKg || 0));
      if (!APP.comparatorFilter) APP.comparatorFilter = [];
      const header = '<div class="flex flex-wrap justify-between items-center mb-3 gap-2">' +
        '<div><h2 class="text-xl font-bold">📊 Formula Comparison</h2>' +

        '<div class="flex gap-2 items-center">' +
          '<label class="text-xs flex items-center gap-1 cursor-pointer mr-2"><input type="checkbox" id="chkShowRMNameCmp" ' +
          (APP.showRMName ? 'checked' : '') + '> Tampilkan Nama RM</label>' +
          '<button id="btnSelectAllCmp" class="text-xs bg-blue-600 hover:bg-blue-500 text-white px-2 py-1 rounded">Pilih Semua</button>' +
          '<button id="btnSelectNoneCmp" class="text-xs bg-gray-600 hover:bg-gray-500 text-white px-2 py-1 rounded">Kosongkan</button>' +
        '</div></div>';
      const groupedSols = {};
      sols.forEach((s, originalIdx) => {
        const compKeys = Object.keys(s.composition || {}).sort();
        const groupKey = compKeys.join(' + ');
        if (!groupedSols[groupKey]) groupedSols[groupKey] = [];
        groupedSols[groupKey].push({ sol: s, idx: originalIdx });
      });
      let cardsHtml = '';
      const sortedGroupKeys = Object.keys(groupedSols).sort();
      sortedGroupKeys.forEach((groupKey, index) => {
        const groupItems = groupedSols[groupKey];
        const hasSelected = groupItems.some(item => APP.comparatorFilter.indexOf(item.idx) >= 0);
        const displayStyle = hasSelected ? 'grid' : 'none';
        const icon = hasSelected ? '▼' : '▶';
        let displayGroupName = groupKey;
        if (APP.showRMName) {
          displayGroupName = groupKey.split(' + ').map(rmid => {
            const rm = findRM(rmid);
            return rm ? rm.name : rmid;
          }).join(' + ');
        }
        const costs = groupItems.map(item => item.sol.costPerKg || 0);
        const minCost = Math.min(...costs);
        const maxCost = Math.max(...costs);
        let hppRangeText = minCost === maxCost ? `HPP: ${fmtRp(minCost)}/kg` : `HPP: ${fmtRp(minCost)} - ${fmtRp(maxCost)}/kg`;
        cardsHtml += `
          <div class="border rounded mb-3 col-span-full">
            <div class="group-header bg-blue-50 p-2 cursor-pointer flex justify-between items-center select-none" data-target="grp-${index}">
              <div class="font-bold text-sm text-blue-800">
                ${icon} 📦 Kombinasi: ${escapeHtml(displayGroupName)}
                <span class="text-xs font-normal text-blue-600 ml-1">(${groupItems.length} opsi)</span>
              </div>
              <div class="text-xs font-semibold text-blue-700 bg-blue-100 px-2 py-0.5 rounded border border-blue-200">
                ${hppRangeText}
              </div>
            </div>
            <div id="grp-${index}" class="group-content grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 p-2" style="display: ${displayStyle};">
        `;
        groupItems.forEach(item => {
          const s = item.sol;
          const i = item.idx;
          const selected = APP.comparatorFilter.indexOf(i) >= 0;
          const borderCls = selected ? 'border-blue-500 bg-blue-50' : 'border-gray-200 bg-white opacity-60';
          const comp = s.composition || {};
          const sortedRMs = Object.keys(comp).sort((a, b) => comp[b] - comp[a]);
          const compHtml = sortedRMs.map(k => {
            const cls = rmColorClass(k);
            const rm = findRM(k);
            const label = APP.showRMName && rm ? rm.name : k;
            return '<div class="flex justify-between text-xs"><span><span class="inline-block px-1 rounded ' + cls + ' font-bold">' + escapeHtml(label) + '</span></span>' +
              '<span class="font-semibold">' + fmtNum(comp[k], 1) + '%</span></div>';
          }).join('');
          cardsHtml += `
            <div class="cmp-card border-2 ${borderCls} rounded p-2 cursor-pointer select-none" data-idx="${i}">
              <div class="flex justify-between items-start mb-1">
                <div><div class="font-bold text-xs">Opsi ${i + 1}</div></div>
                <input type="checkbox" class="cmp-cb" data-idx="${i}" ${selected ? 'checked' : ''}>
              </div>
              <div class="mb-1 pb-1 border-b">
                <div class="text-[10px] text-gray-600">HPP/kg</div>
                <div class="font-bold text-sm">${fmtRp(s.costPerKg)}</div>
              </div>
              <div class="space-y-0.5">${compHtml}</div>
            </div>
          `;
        });
        cardsHtml += `</div></div>`;
      });
      c.innerHTML = '<div class="card p-4">' + header +
        renderPriceSpectrum(sols) +
        '<div class="grid grid-cols-1 gap-2 mb-4">' + cardsHtml + '</div>' +
        '<div id="cmpTableContainer"></div></div>';
      document.querySelectorAll('.group-header').forEach(header => {
        header.addEventListener('click', () => {
          const targetId = header.dataset.target;
          const content = document.getElementById(targetId);
          const iconSpan = header.querySelector('div');
          if (content.style.display === 'none') { content.style.display = 'grid'; iconSpan.innerHTML = iconSpan.innerHTML.replace('▶', '▼'); }
          else { content.style.display = 'none'; iconSpan.innerHTML = iconSpan.innerHTML.replace('▼', '▶'); }
        });
      });
      c.querySelectorAll('.cmp-card').forEach(card => {
        card.addEventListener('click', e => {
          if (e.target.tagName === 'INPUT') return;
          toggleCmpFilter(parseInt(card.dataset.idx, 10));
          const isSel = APP.comparatorFilter.indexOf(parseInt(card.dataset.idx, 10)) >= 0;
          if (isSel) card.className = card.className.replace('border-gray-200 bg-white opacity-60', 'border-blue-500 bg-blue-50');
          else card.className = card.className.replace('border-blue-500 bg-blue-50', 'border-gray-200 bg-white opacity-60');
        });
      });
      c.querySelectorAll('.cmp-cb').forEach(cb => {
        cb.addEventListener('change', e => toggleCmpFilter(parseInt(cb.dataset.idx, 10), e.target.checked));
      });
      document.getElementById('btnSelectAllCmp').addEventListener('click', () => {
        APP.comparatorFilter = sols.map((_, i) => i);
        renderComparatorTab(c);
      });
      document.getElementById('btnSelectNoneCmp').addEventListener('click', () => {
        APP.comparatorFilter = [];
        renderComparatorTab(c);
      });
      const chkNameCmp = document.getElementById('chkShowRMNameCmp');
      if (chkNameCmp) chkNameCmp.addEventListener('change', e => { APP.showRMName = e.target.checked; renderComparatorTab(c); });
      renderComparatorTable(sols);
    }

    function toggleCmpFilter(idx, forceState) {
      if (!APP.comparatorFilter) APP.comparatorFilter = [];
      const pos = APP.comparatorFilter.indexOf(idx);
      const shouldSelect = forceState !== undefined ? forceState : (pos < 0);
      if (shouldSelect && pos < 0) APP.comparatorFilter.push(idx);
      else if (!shouldSelect && pos >= 0) APP.comparatorFilter.splice(pos, 1);
      const card = document.querySelector('.cmp-card[data-idx="' + idx + '"]');
      if (card) {
        const selected = APP.comparatorFilter.indexOf(idx) >= 0;
        card.className = 'cmp-card border-2 ' + (selected ? 'border-blue-500 bg-blue-50' : 'border-gray-200 bg-white opacity-60') + ' rounded p-2 cursor-pointer select-none';
        const cb = card.querySelector('.cmp-cb'); if (cb) cb.checked = selected;
      }
      const counter = document.getElementById('cmpSelCount');
      if (counter) counter.textContent = APP.comparatorFilter.length;
      const res = APP.lastOptimizerResult;
      if (res && res.feasible && res.results) {
        const sols = res.results.slice().sort((a, b) => (a.costPerKg || 0) - (b.costPerKg || 0));
        renderComparatorTable(sols);
      }
    }

    function renderComparatorTable(sorted) {
      const container = document.getElementById('cmpTableContainer');
      if (!container) return;
      const selected = APP.comparatorFilter || [];
      if (selected.length < 1) {
        container.innerHTML = '<div class="p-3 bg-yellow-50 rounded text-sm text-yellow-800">Pilih minimal 1 opsi untuk dibandingkan.</div>';
        return;
      }
      const selectedSols = selected.map(i => sorted[i]).filter(Boolean);
      const nutrientKeys = APP.data.nutrientKeys;
      const product = findProduct(APP.lastOptimizerResult.productId);
      const productTarget = product ? product.target : {};
      const density = product ? product.density : 1.03;
      const servingMl = (APP.data.servingSettings && APP.data.servingSettings.defaultServingMl) || 200;
      const summaryHeader = '<tr class="bg-blue-100">' +
        '<th class="cmp-sticky-col text-left px-2 py-1 text-xs">Metrik</th>' +
        selectedSols.map((s, i) => '<th class="text-center px-2 py-1 text-xs whitespace-nowrap">Opsi ' + (selected[i] + 1) + '</th>').join('') +
        '</tr>';
      const summaryRows = [
        { label: 'HPP/kg', val: s => fmtRp(s.costPerKg) },
        { label: 'HPP/L', val: s => fmtRp((s.costPerKg || 0) * density) },
        { label: 'HPP/saji', val: s => fmtRp((s.costPerKg || 0) * density * servingMl / 1000) }
      ].map(row =>
        '<tr class="border-b bg-gray-50"><td class="cmp-sticky-col px-2 py-1 text-xs font-semibold">' + row.label + '</td>' +
        selectedSols.map(s => '<td class="text-center px-2 py-1 text-xs font-semibold">' + row.val(s) + '</td>').join('') + '</tr>'
      ).join('');
      const summaryTable = '<table class="w-full text-sm mb-4" style="table-layout:fixed">' +
        '<colgroup><col style="width:140px"><col span="' + selectedSols.length + '"></colgroup>' +
        '<thead>' + summaryHeader + '</thead><tbody>' + summaryRows + '</tbody></table>';
      const allRMIDs = [];
      const rmSet = {};
      selectedSols.forEach(s => {
        Object.keys(s.composition || {}).forEach(rmid => {
          if (!rmSet[rmid]) { rmSet[rmid] = true; allRMIDs.push(rmid); }
        });
      });
      allRMIDs.sort();
      const recipeRows = allRMIDs.map(rmid => {
        const rm = findRM(rmid);
        const cls = rmColorClass(rmid);
        const cells = selectedSols.map(s => {
          const v = (s.composition && s.composition[rmid]) || 0;
          if (v === 0) return '<td class="text-center px-2 py-1 text-xs text-gray-400">-</td>';
          return '<td class="text-center px-2 py-1 text-xs font-semibold">' + fmtNum(v, 2) + '%</td>';
        }).join('');
        return '<tr class="border-b hover:bg-gray-50"><td class="cmp-sticky-col px-2 py-1 text-xs">' +
          '<span class="inline-block px-1 rounded ' + cls + ' font-bold">' + escapeHtml(rmid) + '</span><br>' +
          '<span class="text-[10px] text-gray-500">' + escapeHtml(rm ? rm.name : '') + '</span></td>' + cells + '</tr>';
      }).join('');
      const recipeHeader = '<tr class="bg-blue-100"><th class="cmp-sticky-col text-left px-2 py-1 text-xs">RM</th>' +
        selectedSols.map((s, i) => '<th class="text-center px-2 py-1 text-xs whitespace-nowrap">Opsi ' + (selected[i] + 1) + '</th>').join('') + '</tr>';
      const recipeTable = '<div class="overflow-x-auto"><table class="w-full text-sm" style="table-layout:fixed">' +
        '<colgroup><col style="width:140px"><col span="' + selectedSols.length + '"></colgroup>' +
        '<thead>' + recipeHeader + '</thead><tbody>' + recipeRows + '</tbody></table></div>';
      const MACRO_KEYS = ['protein', 'fatTotal', 'saturatedFat', 'carbohydrateTotal', 'sugarTotal', 'sucrose', 'dietaryFiber'];
      const UPPER_BOUND_KEYS = ['sugarTotal', 'sodium', 'sucrose'];
      const algMap = {};
      APP.data.algReference.forEach(a => { algMap[a.key] = a; });
      const activeKeys = nutrientKeys.filter(k => productTarget[k] && productTarget[k] > 0);
      const nutrientMatrix = {};
      nutrientKeys.forEach(k => { nutrientMatrix[k] = []; });
      selectedSols.forEach(sol => {
        const comp = sol.composition || {};
        const rms = Object.keys(comp).map(rmid => ({ rm: findRM(rmid), pct: comp[rmid] })).filter(x => x.rm);
        let totalPct = 0;
        rms.forEach(x => { totalPct += x.pct / 100; });
        nutrientKeys.forEach(k => {
          let v = 0;
          rms.forEach(x => { v += (x.pct / 100) * (x.rm.nutrients[k] || 0); });
          if (totalPct > 0 && totalPct < 0.999) v = v / totalPct;
          nutrientMatrix[k].push(v);
        });
      });
      const nutrientRows = activeKeys.map(key => {
        const meta = algMap[key] || {};
        const label = meta.zatGizi || key;
        const unit = meta.satuan || '';
        const tgt = productTarget[key];
        const isUpper = UPPER_BOUND_KEYS.indexOf(key) >= 0;
        const isMacro = MACRO_KEYS.indexOf(key) >= 0;
        const algVal = meta.algValue || 0;
        const cells = selectedSols.map((s, ci) => {
          const v = nutrientMatrix[key][ci] || 0;
          let displayVal, ok;
          if (isMacro) {
            displayVal = fmtNum(v, 2) + ' ' + unit;
            ok = isUpper ? (v <= tgt + 1e-6) : (v >= tgt - 1e-6);
          } else if (algVal > 0) {
            const pctAKG = (v * servingMl / 100) / algVal * 100;
            displayVal = fmtNum(pctAKG, 1) + '%';
            ok = isUpper ? (v <= tgt + 1e-6) : (v >= tgt - 1e-6);
          } else {
            displayVal = fmtNum(v, 2) + ' ' + unit;
            ok = isUpper ? (v <= tgt + 1e-6) : (v >= tgt - 1e-6);
          }
          const cls = 'text-center px-2 py-1 text-xs ' + (ok ? 'text-green-700' : 'text-red-700 font-semibold');
          return '<td class="' + cls + '">' + displayVal + '</td>';
        }).join('');
        let targetLabel;
        if (isMacro) targetLabel = (isUpper ? '≤ ' : '≥ ') + fmtNum(tgt, 2) + ' ' + unit;
        else if (algVal > 0) {
          const targetPctAKG = (tgt * servingMl / 100) / algVal * 100;
          targetLabel = (isUpper ? '≤ ' : '≥ ') + fmtNum(targetPctAKG, 1) + '% AKG';
        } else targetLabel = (isUpper ? '≤ ' : '≥ ') + fmtNum(tgt, 2) + ' ' + unit;
        const badge = isMacro ? '' : '<span class="text-[9px] bg-gray-200 text-gray-700 px-1 rounded ml-1">%AKG</span>';
        return '<tr class="border-b hover:bg-gray-50"><td class="cmp-sticky-col px-2 py-1 text-xs"><b>' + escapeHtml(label) + '</b>' + badge +
          '<br><span class="text-[10px] text-gray-500">target ' + targetLabel + '</span></td>' + cells + '</tr>';
      }).join('');
      const nutrientHeader = '<tr class="bg-blue-100"><th class="cmp-sticky-col text-left px-2 py-1 text-xs">Nutrisi</th>' +
        selectedSols.map((s, i) => '<th class="text-center px-2 py-1 text-xs whitespace-nowrap">Opsi ' + (selected[i] + 1) + '</th>').join('') + '</tr>';
      const nutrientTable = '<div class="overflow-x-auto"><table class="w-full text-sm" style="table-layout:fixed">' +
        '<colgroup><col style="width:140px"><col span="' + selectedSols.length + '"></colgroup>' +
        '<thead>' + nutrientHeader + '</thead><tbody>' + nutrientRows + '</tbody></table></div>';
      const activeTab = APP.comparatorSubTab || 'recipe';
      const subtabNav = '<div class="flex gap-1 border-b mb-3">' +
        '<button class="cmp-subtab px-4 py-2 text-sm font-semibold border-b-2 ' + (activeTab === 'recipe' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600') + '" data-subtab="recipe">🍶 Resep</button>' +
        '<button class="cmp-subtab px-4 py-2 text-sm font-semibold border-b-2 ' + (activeTab === 'nutrisi' ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600') + '" data-subtab="nutrisi">🧪 Nutrisi</button></div>';
      const recipePane = '<div class="cmp-subpane" data-pane="recipe" style="' + (activeTab === 'recipe' ? '' : 'display:none') + '">' + recipeTable + '</div>';
      const nutrientPane = '<div class="cmp-subpane" data-pane="nutrisi" style="' + (activeTab === 'nutrisi' ? '' : 'display:none') + '">' + nutrientTable + '</div>';
      container.innerHTML =
        '<h3 class="font-bold text-base mb-2">Perbandingan (' + selectedSols.length + ' opsi)</h3>' +
        '<div class="overflow-x-auto mb-4">' + summaryTable + '</div>' +
        subtabNav +
        '<div class="cmp-subpanes">' + recipePane + nutrientPane + '</div>' +
        '<p class="text-xs text-gray-500 mt-2">Hijau = memenuhi target · Merah = gagal</p>';
      container.querySelectorAll('.cmp-subtab').forEach(btn => {
        btn.addEventListener('click', () => {
          const tab = btn.dataset.subtab;
          APP.comparatorSubTab = tab;
          container.querySelectorAll('.cmp-subtab').forEach(b => {
            const active = b.dataset.subtab === tab;
            b.className = 'cmp-subtab px-4 py-2 text-sm font-semibold border-b-2 ' + (active ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-600');
          });
          container.querySelectorAll('.cmp-subpane').forEach(p => {
            p.style.display = p.dataset.pane === tab ? '' : 'none';
          });
        });
      });
    }

    // TAB: RAW MATERIAL

        '<th class="text-right px-2 py-1">Protein</th><th class="text-right px-2 py-1">Fat</th>' +
        '<th class="text-right px-2 py-1">Gula</th><th class="text-right px-2 py-1">SNF</th>' +
        '<th class="text-right px-2 py-1">Min–Max</th><th class="text-left px-2 py-1">Status</th>' +
        '<th class="text-left px-2 py-1">Aksi</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="text-xs text-gray-500 mt-2">' + rms.length + ' RM · ' + rms.filter(r => r.isActive).length + ' aktif</p></div>';

      c.querySelectorAll('.edit-rm').forEach(btn => btn.addEventListener('click', () => showRMForm(btn.dataset.rmid)));

    async function deleteRM(rmid) {
      if (!confirm('Soft-delete ' + rmid + '?')) return;
      try {
        const res = await callApi('api_deleteRawMaterial', [rmid]);
        if (!res.ok) throw new Error(res.error || 'Gagal');
        showToast('RM ' + rmid + ' dinonaktifkan', 'success');
        await loadInitialData(true);
      } catch (e) { showToast('Gagal: ' + e.message, 'error'); }
    }

    function showRMForm(rmid) {
      const rm = rmid ? findRM(rmid) : null;
      const isEdit = !!rm;
      const base = rm || {
        rmid: '', name: '', category: 'Dairy', pricePerKg: 0, moisture: 0,
        nutrients: {}, snf: 0, totalSolid: 0, pH: 6.7, minPct: 0, maxPct: 100,
        stabilityFlags: '', sensoryNotes: '', isActive: true,
        waterParams: {}
      };
      const nutr = base.nutrients || {};
      const baseWater = base.waterParams || {};
      const algMap = {};
      APP.data.algReference.forEach(a => { if (a && a.key) algMap[a.key] = a; });

      const buildNutrField = (key) => {
        const a = algMap[key];
        const label = a && a.zatGizi ? a.zatGizi : key;
        const unit = a && a.satuan ? a.satuan : '-';
        return {
          name: 'nutr__' + key,
          label: label + ' (' + unit + ')',
          value: (nutr[key] !== undefined && nutr[key] !== null) ? nutr[key] : 0,
          type: 'number', min: 0, step: '0.001'
        };
      };

      const groupEnergi = ['energyTotal', 'energyFromFat', 'energyFromSatFat'].map(buildNutrField);
      const groupKarbo = ['carbohydrateTotal', 'dietaryFiber', 'sugarTotal', 'sucrose', 'lactose'].map(buildNutrField);
      const groupLemak = ['fatTotal', 'saturatedFat', 'transFat', 'cholesterol', 'linoleicAcid', 'alphaLinolenicAcid'].map(buildNutrField);
      const groupProtein = ['protein'].map(buildNutrField);
      const mineralKeys = ['sodium','potassium','calcium','phosphorus','magnesium','iron','zinc','iodine','selenium'];
      const vitaminKeys = ['vitA','vitD','vitE','vitK','vitB1','vitB2','vitB3','vitB5','vitB6','folate','vitB12','biotin','vitC'];

      // Field air — hanya dibuat jika kategori = Water
      const isWaterCategory = String(base.category || '').trim().toLowerCase() === 'water';
      const waterFields = isWaterCategory ? WATER_FIELDS.map(f => {
        const v = baseWater[f.key] !== undefined ? baseWater[f.key] : '';
        let hint = '';
        if (f.op === 'ph') hint = 'Rentang aman: ' + WATER_PH_MIN + ' – ' + WATER_PH_MAX;
        else hint = 'Batas kritis: > ' + f.limit + ' ' + f.unit;
        return {
          name: 'water__' + f.key,
          label: f.label + (f.unit ? ' (' + f.unit + ')' : ''),
          value: v,
          type: 'number', min: 0, step: '0.01',
          hint: hint
        };
      }) : [];

      const TABS = {
        general: [
          { name: 'RMID', label: 'RMID (Auto)', value: base.rmid, readonly: true, type: 'text', placeholder: 'Auto-generate' },
          { name: 'RM', label: 'Nama RM *', value: base.name, type: 'text' },
          { name: 'Category', label: 'Kategori (Ketik atau Pilih)', value: base.category, type: 'datalist',
            options: ['Raw Milk', 'Milk Powder', 'Dairy', 'Sweetener', 'Fat', 'Stabilizer', 'Buffer', 'Water', 'Premix', 'Emulsifier', 'Sub-Resep'] },,
          { name: 'Price/kg (Rp)', label: 'Harga/kg (Rp)', value: base.pricePerKg, type: 'number', min: 0 },
          { name: 'is_active', label: 'Status Aktif', value: base.isActive, type: 'checkbox' }
        ],
        air: isWaterCategory ? [
          { type: 'group', label: 'Parameter Air Baku (7)', cls: 'water-group-title' },
          ...waterFields
        ] : null,
        kimia: [
          { name: 'Moisture (%)', label: 'Moisture (%)', value: base.moisture, type: 'number', min: 0, max: 100, step: '0.1' },
          { name: 'SNF (g)', label: 'SNF (g)', value: base.snf, type: 'number', min: 0, step: '0.01' },
          { name: 'Total Solid (g)', label: 'Total Solid (g)', value: base.totalSolid, type: 'number', min: 0, step: '0.01' },
          { name: 'pH', label: 'pH', value: base.pH, type: 'number', min: 0, max: 14, step: '0.01' },
          { name: 'Min %', label: 'Dosis Min %', value: base.minPct, type: 'number', min: 0, max: 100, step: '0.1' },
          { name: 'Max %', label: 'Dosis Max %', value: base.maxPct, type: 'number', min: 0, max: 100, step: '0.1' },
          { name: 'Stability Flags', label: 'Stability Flags', value: base.stabilityFlags, type: 'text' },
          { name: 'Sensory Notes', label: 'Sensory Notes', value: base.sensoryNotes, type: 'text' },
          { type: 'group', label: 'Energi' }, ...groupEnergi,
          { type: 'group', label: 'Karbohidrat & Gula' }, ...groupKarbo,
          { type: 'group', label: 'Lemak & Asam Lemak' }, ...groupLemak,
          { type: 'group', label: 'Protein' }, ...groupProtein
        ],
        mineral: mineralKeys.map(buildNutrField),
        vitamin: vitaminKeys.map(buildNutrField)
      };

      const renderField = f => {
        if (f.type === 'group') {
          const cls = f.cls || 'vit-group-title';
          return '<div class="col-span-full ' + cls + '">' + escapeHtml(f.label) + '</div>';
        }
        if (f.type === 'checkbox') {
          return '<div class="form-field-item"><label class="form-label flex items-center gap-2">' +
            '<input type="checkbox" name="' + escapeHtml(f.name) + '"' + (f.value ? ' checked' : '') + '>' +
            escapeHtml(f.label) + '</label></div>';
        }
        if (f.type === 'select') {
          const opts = f.options.map(o => '<option value="' + escapeHtml(o) + '"' + (o === f.value ? ' selected' : '') + '>' + escapeHtml(o) + '</option>').join('');
          return '<div class="form-field-item"><label class="form-label">' + escapeHtml(f.label) + '</label>' +
            '<select name="' + escapeHtml(f.name) + '" class="form-input">' + opts + '</select></div>';
        }
        if (f.type === 'datalist') {
          const listId = 'dl_' + f.name.replace(/\s+/g, '_');
          const opts = f.options.map(o => '<option value="' + escapeHtml(o) + '">').join('');
          return '<div class="form-field-item"><label class="form-label">' + escapeHtml(f.label) + '</label>' +
            '<div class="flex">' +
            '  <input type="text" name="' + escapeHtml(f.name) + '" id="inp_' + listId + '" class="form-input rounded-r-none" value="' + escapeHtml(f.value || '') + '" placeholder="Pilih atau ketik baru...">' +
            '  <select id="sel_' + listId + '" class="border border-l-0 rounded-r bg-gray-50 text-xs px-1 w-8">' +
            '    <option value="">▼</option>' + opts +
            '  </select>' +
            '</div></div>' +
            '<script>' +
            '  setTimeout(function(){' +
            '    var s = document.getElementById("sel_' + listId + '");' +
            '    if(s) s.addEventListener("change", function(){' +
            '      var i = document.getElementById("inp_' + listId + '");' +
            '      if(this.value) i.value = this.value;' +
            '    });' +
            '  }, 100);' +
            '<\/script>';
        }
        const step = f.step || '';
        const min = f.min !== undefined ? ' min="' + f.min + '"' : '';
        const max = f.max !== undefined ? ' max="' + f.max + '"' : '';
        const ro = f.readonly ? ' readonly' : '';
        const hint = f.hint ? '<div class="text-[10px] text-gray-500 mt-0.5">' + escapeHtml(f.hint) + '</div>' : '';
        return '<div class="form-field-item"><label class="form-label">' + escapeHtml(f.label) + '</label>' +
          '<input type="' + f.type + '" name="' + escapeHtml(f.name) + '" class="form-input" value="' +
          escapeHtml(f.value === undefined || f.value === null ? '' : f.value) + '" step="' + step + '"' + min + max + ro + '>' + hint + '</div>';
      };

      const wrapFields = fields => '<div class="form-field-grid">' + fields.map(renderField).join('') + '</div>';

      // Tab defs — Air hanya muncul kalau kategori Water
      const tabButtonDefs = [
        { id: 'general', label: '📋 General' },
        TABS.air ? { id: 'air', label: '💧 Air' } : null,
        { id: 'kimia', label: '🧪 Kimia & Makro' },
        { id: 'mineral', label: '⚡ Mineral' },
        { id: 'vitamin', label: '💊 Vitamin' }
      ].filter(Boolean);

      const tabButtons = tabButtonDefs.map(t =>
        '<button type="button" class="rm-tab-btn px-3 py-1.5 text-sm border-b-2 border-transparent" data-tab="' + t.id + '">' + t.label + '</button>'
      ).join('');

      const tabPaneDefs = [
        { id: 'general', content: wrapFields(TABS.general) },
        TABS.air ? { id: 'air', content: wrapFields(TABS.air) } : null,
        { id: 'kimia', content: wrapFields(TABS.kimia) },
        { id: 'mineral', content: wrapFields(TABS.mineral) },
        { id: 'vitamin', content: wrapFields(TABS.vitamin) }
      ].filter(Boolean);

      const tabPanes = tabPaneDefs.map(t =>
        '<div class="rm-tab-pane" data-pane="' + t.id + '" style="display:none">' + t.content + '</div>'
      ).join('');

      const body = '<div class="modal-form-container">' +
        '<div class="border-b mb-3 flex flex-wrap gap-1">' + tabButtons + '</div>' +
        '<div class="rm-tab-content">' + tabPanes + '</div>' +
        '<div class="mt-4 flex gap-2 justify-end sticky bottom-0 bg-white py-3 border-t">' +
        '<button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Batal</button>' +
        '<button id="btnSaveRM" class="px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white rounded text-sm font-medium">Simpan</button>' +
        '</div></div>';

      openModal(isEdit ? 'Edit RM ' + rmid : 'Tambah Raw Material', body);

      const tabBtns = document.querySelectorAll('.rm-tab-btn');
      const tabPanesEls = document.querySelectorAll('.rm-tab-pane');
      const activateTab = id => {
        tabBtns.forEach(b => {
          const active = b.dataset.tab === id;
          b.className = 'rm-tab-btn px-3 py-1.5 text-sm border-b-2 ' + (active ? 'border-blue-600 text-blue-600 font-semibold' : 'border-transparent text-gray-600 hover:text-blue-600');
        });
        tabPanesEls.forEach(p => { p.style.display = p.dataset.pane === id ? 'block' : 'none'; });
      };
      tabBtns.forEach(b => b.addEventListener('click', () => activateTab(b.dataset.tab)));
      activateTab('general');

      // Notifikasi jika user ganti kategori ke Water saat form sudah ter-render tanpa tab Air
      const categorySelect = document.querySelector('select[name="Category"]');
      if (categorySelect) {
        categorySelect.addEventListener('change', (e) => {
          const newCat = String(e.target.value || '').trim().toLowerCase();
          if (newCat === 'water' && !TABS.air) {
            showToast('Kategori diubah ke Water. Simpan dulu, lalu buka kembali form untuk edit parameter air.', 'info');
          }
        });
      }

      document.getElementById('btnSaveRM').addEventListener('click', async () => {
        try {
          const form = document.querySelector('.modal-panel');
          const inputs = form.querySelectorAll('input, select');
          const payload = {};
          const nutrients = {};
          const waterParams = {};

          inputs.forEach(inp => {
            const name = inp.name;
            if (!name) return;
            if (name.indexOf('nutr__') === 0) nutrients[name.substring(6)] = safeNumLocal(inp.value);
            else if (name.indexOf('water__') === 0) waterParams[name.substring(7)] = safeNumLocal(inp.value);
            else if (inp.type === 'checkbox') payload[name] = inp.checked;
            else if (inp.type === 'number') payload[name] = safeNumLocal(inp.value);
            else payload[name] = inp.value;
          });

          const COL_MAP = {
            energyTotal: 'Energi (kcal)', protein: 'Protein (g)', fatTotal: 'Fat (g)',
            saturatedFat: 'Saturated Fat (g)', transFat: 'Trans Fat (g)', cholesterol: 'Cholesterol (mg)',
            linoleicAcid: 'Linoleic (mg)', alphaLinolenicAcid: 'Alpha-Linolenic (mg)',
            carbohydrateTotal: 'Karbohidrat (g)', dietaryFiber: 'Serat (g)',
            lactose: 'Laktosa (g)', sucrose: 'Sukrosa (g)', sugarTotal: 'Gula Total (g)',
            calcium: 'Ca (mg)', phosphorus: 'P (mg)', sodium: 'Natrium (mg)',
            potassium: 'Kalium (mg)', magnesium: 'Magnesium (mg)', iron: 'Besi (mg)',
            zinc: 'Seng (mg)', iodine: 'Iodium (mcg)', selenium: 'Selenium (mcg)',
            vitA: 'Vit A (IU)', vitD: 'Vit D (IU)', vitE: 'Vit E (mg)', vitK: 'Vit K (mcg)',
            vitB1: 'Vit B1 (mg)', vitB2: 'Vit B2 (mg)', vitB3: 'Vit B3 (mg)',
            vitB5: 'Vit B5 (mg)', vitB6: 'Vit B6 (mg)', folate: 'Folat (mcg)',
            vitB12: 'Vit B12 (mcg)', biotin: 'Biotin (mcg)', vitC: 'Vit C (mg)'
          };
          Object.keys(COL_MAP).forEach(k => { payload[COL_MAP[k]] = nutrients[k] || 0; });

          // Water column mapping — hanya jika tab Air ada (kategori Water)
          if (TABS.air) {
            const WATER_COL_MAP = {
              waterHardness: 'Water Hardness (mg/L)',
              waterTds: 'Water TDS (mg/L)',
              waterCa: 'Water Ca (mg/L)',
              waterMg: 'Water Mg (mg/L)',
              waterPh: 'Water pH',
              waterIron: 'water_iron (mg/L)',
              waterAlkalinity: 'water_alkalinity (mg/L)'
            };
            Object.keys(WATER_COL_MAP).forEach(k => {
              if (waterParams[k] !== undefined) payload[WATER_COL_MAP[k]] = waterParams[k];
            });
          }

          if (!payload['Moisture (%)']) payload['Moisture (%)'] = 0;

          const res = await callApi('api_upsertRawMaterial', [payload]);
          if (!res.ok) throw new Error(res.error || 'Gagal');
          closeModal();
          showToast('RM ' + payload.RMID + ' ' + (isEdit ? 'diupdate' : 'ditambahkan'), 'success');
          await loadInitialData(true);
        } catch (e) {
          showToast('Gagal: ' + e.message, 'error');
        }
      });
    }

          { name: 'Biotin %AKG', label: 'Biotin/B7 (%AKG)', value: pct['biotin'] || 0, type: 'number', min: 0, step: '0.1' },

        ]
      };

      const algMap = {};
      APP.data.algReference.forEach(a => { algMap[a.key] = a; });
      const HEADER_MAP = {
        calcium: 'Ca %AKG', phosphorus: 'P %AKG', potassium: 'K %AKG',
        magnesium: 'Mg %AKG', iron: 'Fe %AKG', zinc: 'Zn %AKG',
        iodine: 'I %AKG', selenium: 'Se %AKG'
      };
      const buildMicroTab = keys => keys.filter(k => algMap[k]).map(k => {
        const a = algMap[k];
        const headerName = HEADER_MAP[k];
        return { name: headerName, label: a.zatGizi + ' (%AKG)', value: pct[k] || 0, type: 'number', min: 0, step: '0.1' };
      });
      TABS.mineral = buildMicroTab(TABS.mineral);

      const renderField = f => {
        if (f.group) return '<div class="vit-group-title">' + escapeHtml(f.group) + '</div>';
        if (f.isMinMax) {
          const roMax = f.isMaxDisabled ? ' disabled bg-gray-100' : '';
          return '<div class="minmax-row">' +
            '<label>' + escapeHtml(f.label) + '</label>' +
            '<input type="number" name="' + escapeHtml(f.name) + '" class="form-input" value="' + f.value + '" step="' + (f.step || '0.01') + '" placeholder="Min">' +
            (f.maxName
              ? '<input type="number" name="' + escapeHtml(f.maxName) + '" class="form-input" value="' + f.maxValue + '" step="' + (f.step || '0.01') + '" placeholder="Max" ' + roMax + '>'
              : '<input type="text" class="form-input bg-gray-100" value="(tanpa max)" disabled>') +
            '</div>';
        }
        if (f.isSingleMax) {
          return '<div class="minmax-row">' +
            '<label>' + escapeHtml(f.label) + '</label>' +
            '<input type="text" class="form-input bg-gray-100" value="—" disabled>' +
            '<input type="number" name="' + escapeHtml(f.name) + '" class="form-input" value="' + f.value + '" step="' + (f.step || '0.01') + '" placeholder="Max">' +
            '</div>';
        }
        if (f.type === 'checkbox') {
          return '<div class="form-field-item"><label class="form-label flex items-center gap-2">' +
            '<input type="checkbox" name="' + escapeHtml(f.name) + '"' + (f.value ? ' checked' : '') + '>' +
            escapeHtml(f.label) + '</label></div>';
        }
        if (f.type === 'select') {
          const opts = f.options.map(o => '<option value="' + escapeHtml(o) + '"' + (o === f.value ? ' selected' : '') + '>' + escapeHtml(o) + '</option>').join('');
          return '<div class="form-field-item"><label class="form-label">' + escapeHtml(f.label) + '</label>' +
            '<select name="' + escapeHtml(f.name) + '" class="form-input">' + opts + '</select></div>';
        }
        const step = f.step || '';
        const min = f.min !== undefined ? ' min="' + f.min + '"' : '';
        const ro = f.readonly ? ' readonly' : '';
        return '<div class="form-field-item"><label class="form-label">' + escapeHtml(f.label) + '</label>' +
          '<input type="' + f.type + '" name="' + escapeHtml(f.name) + '" class="form-input" value="' +
          escapeHtml(f.value === undefined || f.value === null ? '' : f.value) + '" step="' + step + '"' + min + ro + '></div>';
      };

      const wrapFields = fields => '<div class="form-field-grid">' + fields.map(renderField).join('') + '</div>';
      const wrapMinMaxFields = fields => '<div class="flex flex-col">' + fields.map(renderField).join('') + '</div>';

      const tabButtons = [
        { id: 'general', label: '📋 General' },
        { id: 'makro', label: '🍞 Makronutrien' },
        { id: 'mineral', label: '⚡ Mineral' },
        { id: 'vitamin', label: '💊 Vitamin' }
      ].map(tb => '<button type="button" class="prod-tab-btn px-3 py-1.5 text-sm border-b-2 border-transparent" data-tab="' + tb.id + '">' + tb.label + '</button>').join('');
      const tabPanes = [
        { id: 'general', content: wrapFields(TABS.general) },
        { id: 'makro', content: wrapMinMaxFields(TABS.makro) },
        { id: 'mineral', content: wrapFields(TABS.mineral) },
        { id: 'vitamin', content: wrapMinMaxFields(TABS.vitamin) }
      ].map(tp => '<div class="prod-tab-pane" data-pane="' + tp.id + '" style="display:none">' + tp.content + '</div>').join('');
      const body = '<div class="modal-form-container">' +
        '<div class="border-b mb-3 flex flex-wrap gap-1">' + tabButtons + '</div>' +
        '<div class="prod-tab-content">' + tabPanes + '</div>' +
        '<div class="mt-4 flex gap-2 justify-end sticky bottom-0 bg-white py-3 border-t">' +
        '<button onclick="closeModal()" class="px-3 py-1.5 border rounded text-sm">Batal</button>' +
        '<button id="btnSaveProduct" class="px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white rounded text-sm font-medium">Simpan</button>' +
        '</div></div>';
      openModal(isEdit ? 'Edit Produk ' + pid : 'Tambah Produk', body);

      const tabBtns = document.querySelectorAll('.prod-tab-btn');
      const tabPanesEls = document.querySelectorAll('.prod-tab-pane');
      const activateTab = id => {
        tabBtns.forEach(b => {
          const active = b.dataset.tab === id;
          b.className = 'prod-tab-btn px-3 py-1.5 text-sm border-b-2 ' + (active ? 'border-blue-600 text-blue-600 font-semibold' : 'border-transparent text-gray-600 hover:text-blue-600');
        });
        tabPanesEls.forEach(p => { p.style.display = p.dataset.pane === id ? 'block' : 'none'; });
      };
      tabBtns.forEach(b => b.addEventListener('click', () => activateTab(b.dataset.tab)));
      activateTab('general');

      document.getElementById('btnSaveProduct').addEventListener('click', async () => {
        try {
          const form = document.querySelector('.modal-panel');
          const inputs = form.querySelectorAll('input, select');
          const payload = {};
          inputs.forEach(inp => {
            if (!inp.name) return;
            if (inp.type === 'checkbox') payload[inp.name] = inp.checked;
            else if (inp.type === 'number') payload[inp.name] = safeNumLocal(inp.value);
            else payload[inp.name] = inp.value;
          });
          if (!payload['ProductType'] || String(payload['ProductType']).trim() === '') {
            payload['ProductType'] = 'UHT';
          }
          // TargetTS: kosongkan sebagai '' (parseProduct akan map ke null).
          if (payload['TargetTS'] === undefined || payload['TargetTS'] === null || isNaN(payload['TargetTS'])) {
            payload['TargetTS'] = '';
          }

          const res = await callApi('api_upsertProduct', [payload]);
          if (!res.ok) throw new Error(res.error || 'Gagal');
          closeModal();
          showToast('Produk ' + payload.ProductID + ' ' + (isEdit ? 'diupdate' : 'ditambahkan'), 'success');
          await loadInitialData(true);
        } catch (e) { showToast('Gagal: ' + e.message, 'error'); }
      });
    }
